# Official OpenAI APIs. Credentials live only in the ignored .env.
# Audio and vision use different models/endpoints; no MiMo-only parameters.
providers:
  omni:
    type: openai_native
    model: gpt-6.1-sol
    audio_model: gpt-audio-1.5
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    auth_header: bearer
    reasoning_effort: low
    max_output_tokens: 8192
    max_media_seconds: 30

mock: false
timeout: 120
# No hidden paid retries. A user may explicitly retry a failed analysis.
max_retries: 1
retry_backoff_base: 1.0
confidence_floor: 0.5
knowledge_dir: knowledge
