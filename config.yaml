# petread 模型调用层配置
#
# 当前主力:小米 MiMo-V2.6-Flash,一次调用完成视觉+声学+融合。
# api_key 永远不写在这里,只写环境变量名,运行时从 os.environ 读取。

providers:

  omni:
    type: openai                              # 复用 OpenAICompatibleProvider
    model: "mimo-v2.6-flash"
    # 包括 reasoning + 正文；保留旧模型默认预算，避免新默认 131072。
    max_completion_tokens: 32768
    media_format: mimo                        # MiMo 音频 data URI、视频参数位置
    base_url: "https://api.xiaomimimo.com/v1"
    api_key_env: MIMO_API_KEY

    # 鉴权头形式。官方 curl 示例用 `api-key: $KEY`,Python SDK 示例走标准 OpenAI Bearer,
    # 两者不一致,所以做成可配置。遇到 401 时会自动换成另一种形式重试一次,
    # 并打印最终生效的是哪种,据此把这里改成正确的值即可省掉后续的试探。
    auth_header: bearer                       # bearer | api-key

    # thinking 在顶层；fps / media_resolution 仅放在 video content part。
    thinking: true                            # -> extra_body {"thinking": {"type": "enabled"}}
    fps: 2                                    # 视频采样帧率,--mode native 时生效
    media_resolution: "default"

    media_param_placement: content_part       # 与 video_url 同级，不在其内部

# --- 备选:原三段式配置,MiMo 不可用时切回 ---
# 切回时把下面三段取消注释,并把 pipeline 的调用改回 call_vision / call_audio / call_text。
#
#   vision:
#     type: deepseek
#     model: ""                               # TODO 需支持图像输入
#     base_url: ""                            # 留空 -> https://api.deepseek.com/v1
#     api_key_env: DEEPSEEK_API_KEY
#
#   audio:
#     type: gemini
#     model: ""                               # TODO 需支持音频输入
#     base_url: ""                            # 留空 -> https://generativelanguage.googleapis.com/v1beta
#     api_key_env: GEMINI_API_KEY
#
#   text:
#     type: deepseek
#     model: ""
#     base_url: ""
#     api_key_env: DEEPSEEK_API_KEY

# true 时全部链路替换为 MockProvider,不发任何真实请求。
mock: false

# 单次请求超时(秒)。全模态 + thinking 的视频请求耗时较长,给足余量。
timeout: 300

# 最多尝试次数(含首次)。只对网络错误和 5xx 重试,4xx 不重试。
max_retries: 3

# 指数退避的基准秒数,第 n 次重试等待 retry_backoff_base * 2**(n-1) 再加抖动。
retry_backoff_base: 1.0

# 融合阶段的候选置信度下限,低于此值的候选不进入最终输出。
confidence_floor: 0.5

# 知识库目录,按 species 加载 <species>.yaml
knowledge_dir: knowledge

