<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111417">
<title>petread · 宠物行为判读</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --fg:#14181d; --muted:#6b7480; --line:#e3e7ec;
    --accent:#3f6ef2; --accent-fg:#fff; --warn-bg:#fff6e5; --warn-line:#f0c169;
    --warn-fg:#8a5a00; --ok:#1f9254; --danger:#c0392b; --chip:#eef1f5;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1216; --card:#171b21; --fg:#e8ecf1; --muted:#98a2ae; --line:#262c35;
      --accent:#5b86ff; --warn-bg:#2e2410; --warn-line:#7a5c16; --warn-fg:#f0c169;
      --ok:#43c07d; --danger:#ff6b5a; --chip:#222831;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Microsoft YaHei",system-ui,sans-serif;
    padding:0 0 env(safe-area-inset-bottom);
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:680px;margin:0 auto;padding:16px 14px 48px}
  header{display:flex;align-items:baseline;gap:10px;padding:8px 2px 16px}
  header h1{font-size:20px;margin:0;letter-spacing:.5px}
  header .sub{color:var(--muted);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 12px;font-weight:600}
  label.blk{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    padding:8px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--chip);font-size:14px;cursor:pointer;user-select:none;
    -webkit-tap-highlight-color:transparent;transition:.12s;
  }
  .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);
    border-color:var(--accent)}
  textarea,input[type=text]{
    width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:var(--fg);font:inherit;font-size:15px;resize:vertical;
  }
  textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .filebtn{
    display:block;width:100%;padding:18px;border-radius:12px;text-align:center;
    border:1.5px dashed var(--line);background:var(--bg);cursor:pointer;
    font-size:16px;font-weight:600;
  }
  .filebtn.sec{padding:12px;font-size:14px;font-weight:400;color:var(--muted)}
  .filebtn input{display:none}
  .filename{font-size:13px;color:var(--muted);margin-top:8px;word-break:break-all}
  button.go{
    width:100%;padding:15px;border:0;border-radius:12px;background:var(--accent);
    color:var(--accent-fg);font-size:17px;font-weight:600;cursor:pointer;
  }
  button.go:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:8px;align-items:center}
  .err{background:#fdecea;color:#8b1e12;border:1px solid #f5c4bd;padding:11px 13px;
    border-radius:10px;font-size:14px;margin-top:10px}
  @media (prefers-color-scheme: dark){.err{background:#331816;color:#ffb3a8;border-color:#5c2a24}}
  progress{width:100%;height:8px;appearance:none;border:0;border-radius:99px;overflow:hidden}
  progress::-webkit-progress-bar{background:var(--chip);border-radius:99px}
  progress::-webkit-progress-value{background:var(--accent);border-radius:99px}
  .stage{font-size:13px;color:var(--muted);margin-top:8px;display:flex;
    justify-content:space-between;gap:10px}
  .verdict{font-size:22px;font-weight:650;line-height:1.45;margin:2px 0 14px}
  .confbar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:6px 0}
  .confbar i{display:block;height:100%;background:var(--ok);border-radius:99px}
  .meta{font-size:12px;color:var(--muted);margin-top:12px;
    border-top:1px solid var(--line);padding-top:10px}
  .insuf{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-fg);
    border-radius:12px;padding:14px;margin-bottom:12px}
  .insuf b{display:block;font-size:17px;margin-bottom:6px}
  details{border-top:1px solid var(--line);padding:12px 0 2px;margin-top:12px}
  details summary{cursor:pointer;font-size:14px;font-weight:600;list-style:none;
    display:flex;justify-content:space-between;align-items:center}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:"展开";color:var(--muted);font-weight:400;font-size:13px}
  details[open] summary::after{content:"收起"}
  .tl{margin-top:12px;display:flex;flex-direction:column;gap:10px}
  .tlrow{border-left:3px solid var(--accent);padding:2px 0 2px 11px}
  .tlt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tlv{font-size:14px}
  .tla{font-size:13px;color:var(--muted)}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;
    background:var(--chip);color:var(--muted);margin-left:6px}
  .tag.up{background:#fdecea;color:#c0392b}
  .tag.down{background:#e8f7ee;color:#1f9254}
  @media (prefers-color-scheme: dark){
    .tag.up{background:#3a1d1a;color:#ff9d90}.tag.down{background:#12301f;color:#5fd396}
  }
  pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;
    overflow-x:auto;font-size:11.5px;line-height:1.5;max-height:60vh}
  .ev{font-size:13px;color:var(--muted);margin:4px 0 0;padding-left:14px;
    border-left:2px solid var(--line)}
  .hist{font-size:14px;border-bottom:1px solid var(--line);padding:11px 0}
  .hist:last-child{border-bottom:0}
  .hist .h1{display:flex;justify-content:space-between;gap:10px}
  .hist .h2{font-size:12px;color:var(--muted);margin-top:3px}
  .muted{color:var(--muted)}
  .ok{color:var(--ok)}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>petread</h1>
  <span class="sub">宠物行为判读</span>
</header>

<!-- ============ 输入 ============ -->
<form id="form" class="card">
  <h2>1 · 这是谁</h2>
  <div class="chips" id="species" role="group" aria-label="物种">
    <button type="button" class="chip" data-v="dog" aria-pressed="true">🐕 狗</button>
    <button type="button" class="chip" data-v="cat" aria-pressed="false">🐈 猫</button>
  </div>

  <h2 style="margin-top:20px">2 · 什么场景</h2>
  <label class="blk">选标签(可多选)</label>
  <div class="chips" id="scenes" role="group" aria-label="场景标签"></div>
  <label class="blk" style="margin-top:12px">补充描述(越具体越准)</label>
  <textarea id="ctx" rows="2" placeholder="例:客厅,快递员按门铃,它冲到门口"></textarea>

  <h2 style="margin-top:20px">3 · 素材</h2>
  <label class="filebtn" id="vlabel">
    🎥 录一段视频
    <input type="file" id="video" accept="video/*" capture="environment">
    <div class="filename muted" id="vname">建议 5-15 秒,20MB 以内</div>
  </label>
  <label class="filebtn sec" id="ilabel" style="margin-top:10px">
    📷 只拍一张照片(快速模式,准确度较低)
    <input type="file" id="photo" accept="image/*" capture="environment">
    <div class="filename" id="iname"></div>
  </label>

  <div class="row" style="margin-top:14px">
    <input type="checkbox" id="framesmode" style="width:auto">
    <label for="framesmode" class="muted" style="font-size:13px;margin:0">
      用抽帧链路(对比用,更慢更贵)
    </label>
  </div>

  <div id="formerr" class="err hide"></div>
  <button class="go" id="go" type="submit" style="margin-top:14px" disabled>
    选择素材后开始判读
  </button>
</form>

<!-- ============ 进度 ============ -->
<div class="card hide" id="progcard">
  <h2>判读中</h2>
  <progress id="bar" max="100" value="0"></progress>
  <div class="stage">
    <span id="stagetext">准备中…</span>
    <span id="elapsed" class="muted"></span>
  </div>
</div>

<!-- ============ 结果 ============ -->
<div id="result"></div>

<!-- ============ 历史 ============ -->
<div class="card">
  <h2>历史记录 <span class="muted" style="font-weight:400" id="histcount"></span></h2>
  <div id="hist" class="muted" style="font-size:14px">加载中…</div>
</div>

</div>

<script>
"use strict";

const MAX_VIDEO_MB = 20, MAX_IMAGE_MB = 10;
const SCENES = ["吃饭前","见生人","独处","主人回家","看到其他动物","玩耍中"];
const $ = s => document.querySelector(s);

let species = "dog", picked = new Set(), file = null, fileKind = null;

/* ---------- 场景标签 ---------- */
SCENES.forEach(s => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = s;
  b.setAttribute("aria-pressed", "false");
  b.onclick = () => {
    const on = b.getAttribute("aria-pressed") === "true";
    b.setAttribute("aria-pressed", String(!on));
    on ? picked.delete(s) : picked.add(s);
  };
  $("#scenes").appendChild(b);
});

$("#species").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  [...$("#species").children].forEach(c => c.setAttribute("aria-pressed", String(c === b)));
  species = b.dataset.v;
};

/* ---------- 文件选择 ---------- */
function pickFile(input, kind, limitMB, nameEl, otherInput, otherNameEl) {
  input.onchange = () => {
    const f = input.files[0];
    if (!f) return;
    const mb = f.size / 1024 / 1024;
    if (mb > limitMB) {
      showErr(`这个${kind === "video" ? "视频" : "图片"} ${mb.toFixed(1)}MB,` +
              `超过 ${limitMB}MB 上限。请先裁剪(建议只保留最关键的 5-15 秒)后再上传。`);
      input.value = ""; nameEl.textContent = ""; setFile(null, null);
      return;
    }
    clearErr();
    otherInput.value = ""; otherNameEl.textContent = "";
    nameEl.textContent = `${f.name} · ${mb.toFixed(1)}MB`;
    nameEl.classList.remove("muted");
    setFile(f, kind);
  };
}
pickFile($("#video"), "video", MAX_VIDEO_MB, $("#vname"), $("#photo"), $("#iname"));
pickFile($("#photo"), "image", MAX_IMAGE_MB, $("#iname"), $("#video"), $("#vname"));

function setFile(f, kind) {
  file = f; fileKind = kind;
  const go = $("#go");
  go.disabled = !f;
  go.textContent = !f ? "选择素材后开始判读"
    : (kind === "image" ? "开始判读(快速模式)" : "开始判读");
  $("#framesmode").parentElement.style.display = kind === "image" ? "none" : "";
}
function showErr(m){ const e=$("#formerr"); e.textContent=m; e.classList.remove("hide"); }
function clearErr(){ $("#formerr").classList.add("hide"); }

/* ---------- 提交 ---------- */
$("#form").onsubmit = async e => {
  e.preventDefault();
  if (!file) return;

  const parts = [...picked];
  const free = $("#ctx").value.trim();
  if (free) parts.push(free);
  if (!parts.length) { showErr("请至少选一个场景标签,或写一句场景描述。"); return; }
  clearErr();

  const mode = fileKind === "image" ? "quick" : ($("#framesmode").checked ? "frames" : "native");
  const fd = new FormData();
  fd.append("file", file);
  fd.append("species", species);
  fd.append("context", parts.join("、"));
  fd.append("mode", mode);

  $("#go").disabled = true;
  $("#result").innerHTML = "";
  $("#progcard").classList.remove("hide");
  setProgress(2, "上传中…");
  const t0 = Date.now();
  const tick = setInterval(() => {
    $("#elapsed").textContent = ((Date.now() - t0) / 1000).toFixed(0) + "s";
  }, 250);

  try {
    const resp = await fetch("/analyze", { method: "POST", body: fd });
    if (!resp.ok || !(resp.headers.get("content-type") || "").includes("event-stream")) {
      let msg = `HTTP ${resp.status}`;
      try { const j = await resp.json(); msg = j.detail || JSON.stringify(j); } catch (_) {}
      throw new Error(msg);
    }
    await readSSE(resp.body, onEvent);
  } catch (err) {
    $("#progcard").classList.add("hide");
    $("#result").innerHTML = `<div class="card"><div class="err">判读失败:${esc(String(err.message || err))}</div></div>`;
  } finally {
    clearInterval(tick);
    $("#go").disabled = false;
    loadHistory();
  }
};

/* ---------- SSE 读取(fetch 流,不是 EventSource) ---------- */
async function readSSE(stream, handler) {
  const reader = stream.getReader(), dec = new TextDecoder();
  let buf = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const raw = buf.slice(0, i); buf = buf.slice(i + 2);
      let ev = "message", data = "";
      for (const line of raw.split("\n")) {
        if (line.startsWith("event:")) ev = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      }
      if (data) { try { handler(ev, JSON.parse(data)); } catch (_) {} }
    }
  }
}

function setProgress(p, text) {
  $("#bar").value = p;
  if (text) $("#stagetext").textContent = text;
}

function onEvent(ev, d) {
  if (ev === "progress") setProgress(d.percent, d.message);
  else if (ev === "heartbeat") setProgress($("#bar").value, `模型判读中… 已用 ${d.elapsed_s}s`);
  else if (ev === "error") {
    $("#progcard").classList.add("hide");
    $("#result").innerHTML =
      `<div class="card"><div class="err">判读失败:${esc(d.message)}</div>` +
      (d.raw ? `<pre>${esc(d.raw)}</pre>` : "") + `</div>`;
  }
  else if (ev === "done") { $("#progcard").classList.add("hide"); render(d); }
}

/* ---------- 结果渲染:三层 ---------- */
function render(d) {
  const r = d.result || {}, m = d.meta || {};
  const insuf = !!r.insufficient_evidence;
  const cands = r.candidates || [];
  const top = cands[0] || null;

  let head;
  if (insuf) {
    head = `<div class="insuf">
        <b>信息不足,无法判断</b>
        ${esc(r.insufficient_reason || "可用信号不足以支撑任何结论。")}
      </div>
      ${r.suggestion ? `<div><b>怎么补拍</b><div style="margin-top:6px">${esc(r.suggestion)}</div></div>` : ""}`;
  } else {
    const conf = top && typeof top.confidence === "number" ? top.confidence : null;
    head = `<div class="verdict">${esc(r.translation || "(模型未给出翻译)")}</div>`;
    if (top) {
      head += `<div class="muted" style="font-size:13px">最可能:${esc(top.label || "")}
        ${conf !== null ? `· 置信度 ${(conf * 100).toFixed(0)}%` : ""}</div>`;
      if (conf !== null) head += `<div class="confbar"><i style="width:${(conf * 100).toFixed(0)}%"></i></div>`;
    }
    if (cands.length > 1) {
      head += `<div class="muted" style="font-size:13px;margin-top:8px">其他候选:` +
        cands.slice(1).map(c => `${esc(c.label)} ${(c.confidence * 100).toFixed(0)}%`).join("、") +
        `</div>`;
    }
    if (r.suggestion) {
      head += `<div style="margin-top:14px"><b>可以做什么</b>
        <div style="margin-top:6px">${esc(r.suggestion)}</div></div>`;
    }
  }

  const meta = `<div class="meta">
      ${esc(m.mode)} 模式 · ${esc(m.model || "")} ·
      ${m.latency_s}s · in ${m.tokens_in ?? "-"} / out ${m.tokens_out ?? "-"} tokens
      ${m.motion_features ? ` · 运动 ${esc(m.motion_features.motion_intensity || "")}` : ""}
    </div>`;

  $("#result").innerHTML = `
    <div class="card">
      ${head}${meta}
      ${layer2(r)}
      ${layer3(r)}
    </div>
    <div class="card">
      <h2>实际情况是什么</h2>
      <div class="muted" style="font-size:13px;margin-bottom:10px">
        你的判断比模型更可靠。填一句实际发生了什么,用于后续校准。
      </div>
      <input type="text" id="fb" placeholder="例:它其实是想出门,不是紧张">
      <button class="go" id="fbgo" style="margin-top:10px">提交反馈</button>
      <div id="fbmsg" class="muted" style="font-size:13px;margin-top:8px"></div>
    </div>`;

  $("#fbgo").onclick = async () => {
    const v = $("#fb").value.trim();
    if (!v) { $("#fbmsg").textContent = "写点什么再提交吧。"; return; }
    $("#fbgo").disabled = true;
    try {
      const resp = await fetch(`/feedback/${d.record_id}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ actual_label: v, user_note: "" }),
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      $("#fbmsg").innerHTML = `<span class="ok">已记录,谢谢。</span>`;
      $("#fb").disabled = true;
      loadHistory();
    } catch (e) {
      $("#fbmsg").textContent = "提交失败:" + e.message;
      $("#fbgo").disabled = false;
    }
  };
}

/* 第二层:时间轴 */
function layer2(r) {
  const tl = r.timeline || [];
  const va = r.visual_signals || [], ae = r.audio_events || [];
  if (!tl.length && !va.length && !ae.length) return "";
  const rows = tl.map(t => {
    const rng = Array.isArray(t.t_range) ? `${t.t_range[0]}s – ${t.t_range[1]}s` : esc(String(t.t_range || ""));
    const dir = String(t.direction || "");
    const cls = dir.includes("升级") ? "up" : dir.includes("缓解") ? "down" : "";
    return `<div class="tlrow">
      <div class="tlt">${esc(rng)}${dir ? `<span class="tag ${cls}">${esc(dir)}</span>` : ""}</div>
      <div class="tlv">👁 ${esc(t.visual || "—")}</div>
      <div class="tla">🔊 ${t.audio ? esc(String(t.audio)) : "无声学事件"}</div>
      ${t.motion ? `<div class="tla">📈 ${esc(String(t.motion))}</div>` : ""}
    </div>`;
  }).join("");

  const conflicts = (r.conflicts || []).map(c =>
    `<div class="ev"><b>${esc((c.signals || []).join(" ↔ "))}</b><br>${esc(c.resolution || "")}
     ${c.resolved === false ? '<span class="tag up">未裁决</span>' : ""}</div>`).join("");

  return `<details>
    <summary>时间轴与信号冲突</summary>
    <div class="tl">${rows || '<div class="muted">模型未给出时间轴</div>'}</div>
    <div class="muted" style="font-size:12px;margin-top:12px">
      视觉记录 ${va.length} 条 · 声学事件 ${ae.length} 条
    </div>
    ${conflicts ? `<div style="margin-top:12px"><b style="font-size:13px">冲突裁决</b>${conflicts}</div>` : ""}
    ${evidence(r)}
  </details>`;
}

function evidence(r) {
  const cs = r.candidates || [];
  if (!cs.length) return "";
  return `<div style="margin-top:14px"><b style="font-size:13px">判断依据</b>` +
    cs.map(c => `<div style="margin-top:8px"><b>${esc(c.label)}</b>` +
      (c.evidence || []).map(e =>
        `<div class="ev">${esc(e.channel || "")} = ${esc(String(e.observation ?? ""))}
         <span class="muted">@${esc(String(e.t ?? ""))} · 置信 ${esc(e.signal_confidence || "")}</span></div>`
      ).join("") + `</div>`).join("") + `</div>`;
}

/* 第三层:原始 JSON */
function layer3(r) {
  return `<details><summary>原始 JSON</summary>
    <pre>${esc(JSON.stringify(r, null, 2))}</pre></details>`;
}

/* ---------- 历史 ---------- */
async function loadHistory() {
  try {
    const r = await fetch("/history?limit=20");
    const d = await r.json();
    const items = d.items || [];
    $("#histcount").textContent = items.length ? `(${items.length})` : "";
    if (!items.length) { $("#hist").textContent = "还没有记录。"; return; }
    $("#hist").innerHTML = items.map(it => {
      const verdict = it.insufficient_evidence
        ? `<span style="color:var(--warn-fg)">信息不足</span>`
        : esc(it.translation || it.predicted_label || "—");
      return `<div class="hist">
        <div class="h1">
          <span>${it.species === "cat" ? "🐈" : "🐕"} ${verdict}</span>
          <span class="muted" style="white-space:nowrap">${
            it.confidence != null ? (it.confidence * 100).toFixed(0) + "%" : ""}</span>
        </div>
        <div class="h2">${esc(it.created_at)} · ${esc(it.mode)} · ${esc(it.context || "")}
          ${it.last_actual_label ? ` · <span class="ok">实际:${esc(it.last_actual_label)}</span>` : ""}
        </div>
      </div>`;
    }).join("");
  } catch (e) {
    $("#hist").textContent = "历史加载失败:" + e.message;
  }
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

loadHistory();
</script>
</body>
</html>
