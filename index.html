<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<title>petread · 宠物行为判读</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --card2:#f8f9fb; --fg:#111721; --muted:#69727e;
    --line:#e6e9ee; --accent:#4f6ef7; --accent-fg:#fff;
    --lo:#e8912f; --mid:#4f6ef7; --hi:#1faa5a;           /* 置信度分档色 */
    --warn-bg:#fff7e8; --warn-line:#f0cd82; --warn-fg:#8a5a00;
    --ok:#1faa5a; --danger:#d84b3a; --chip:#eef1f6; --track:#e6e9ee;
    --up-bg:#fdecea; --up-fg:#c0392b; --down-bg:#e7f6ee; --down-fg:#1a8a4e;
    --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 28px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1014; --card:#161a21; --card2:#1b2028; --fg:#e9edf3; --muted:#98a2ae;
      --line:#272d37; --accent:#6b8bff; --accent-fg:#0d1014;
      --lo:#e5a24a; --mid:#6b8bff; --hi:#43c07d;
      --warn-bg:#2b2411; --warn-line:#6f571c; --warn-fg:#f0c877;
      --ok:#43c07d; --danger:#ff6b5a; --chip:#232a34; --track:#2a313c;
      --up-bg:#3a1d1a; --up-fg:#ff9d90; --down-bg:#12301f; --down-fg:#5fd396;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.4);
    }
  }
  @property --pct{ syntax:'<number>'; inherits:false; initial-value:0; }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.62 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Microsoft YaHei",system-ui,sans-serif;
    padding:0 0 calc(40px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:640px;margin:0 auto;padding:18px 15px}
  header{display:flex;align-items:center;gap:10px;padding:6px 4px 18px}
  header .logo{font-size:22px}
  header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.3px}
  header .sub{color:var(--muted);font-size:13px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card.hero{padding:22px 20px}
  h2.sec{font-size:13px;margin:0 0 12px;font-weight:600;color:var(--muted);
    letter-spacing:.4px;text-transform:none}
  .step{font-size:13px;font-weight:700;color:var(--accent);margin-right:6px}

  /* -------- chips / inputs -------- */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--chip);font-size:14px;cursor:pointer;user-select:none;
    -webkit-tap-highlight-color:transparent;transition:.14s}
  .chip:active{transform:scale(.96)}
  .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);
    border-color:var(--accent)}
  label.blk{display:block;font-size:13px;color:var(--muted);margin:14px 0 7px}
  textarea,input[type=text]{width:100%;padding:12px 13px;border-radius:11px;
    border:1px solid var(--line);background:var(--card2);color:var(--fg);
    font:inherit;font-size:15px;resize:vertical}
  textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px}

  .filebtn{display:block;width:100%;padding:20px;border-radius:13px;text-align:center;
    border:1.5px dashed var(--line);background:var(--card2);cursor:pointer;
    font-size:16px;font-weight:600;transition:.14s}
  .filebtn:active{transform:scale(.99)}
  .filebtn.sec{padding:14px;font-size:14px;font-weight:500;color:var(--muted)}
  .filebtn.has{border-style:solid;border-color:var(--accent)}
  .filebtn input{display:none}
  .minibtn{padding:7px 13px;border-radius:9px;border:1px solid var(--line);
    background:var(--chip);font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .minibtn input{display:none}
  .filename{font-size:13px;color:var(--muted);margin-top:9px;word-break:break-all}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  button.go{width:100%;padding:16px;border:0;border-radius:13px;background:var(--accent);
    color:var(--accent-fg);font-size:17px;font-weight:700;cursor:pointer;transition:.14s}
  button.go:active{transform:scale(.99)}
  button.go:disabled{opacity:.4;cursor:not-allowed}
  .err{background:var(--up-bg);color:var(--up-fg);border:1px solid var(--warn-line);
    padding:11px 13px;border-radius:11px;font-size:14px;margin-top:12px}

  /* -------- progress -------- */
  progress{width:100%;height:9px;appearance:none;border:0;border-radius:99px;overflow:hidden}
  progress::-webkit-progress-bar{background:var(--track);border-radius:99px}
  progress::-webkit-progress-value{background:var(--accent);border-radius:99px;transition:.3s}
  progress::-moz-progress-bar{background:var(--accent);border-radius:99px}
  .stage{font-size:13px;color:var(--muted);margin-top:10px;display:flex;
    justify-content:space-between;gap:10px}

  /* -------- hero result -------- */
  .heroTop{display:flex;gap:18px;align-items:center}
  .ring{position:relative;flex:0 0 auto;width:112px;height:112px;border-radius:50%;
    background:conic-gradient(var(--rc,var(--mid)) calc(var(--pct)*3.6deg), var(--track) 0deg);
    transition:--pct .9s cubic-bezier(.22,1,.36,1)}
  .ring .hole{position:absolute;inset:11px;border-radius:50%;background:var(--card);
    display:grid;place-items:center;text-align:center;line-height:1.1}
  .ring .val{font-size:26px;font-weight:750;font-variant-numeric:tabular-nums}
  .ring .lbl{font-size:11px;color:var(--muted);margin-top:2px}
  .heroText{min-width:0}
  .verdict{font-size:21px;font-weight:700;line-height:1.42;margin:0 0 8px;
    letter-spacing:.2px}
  .toplabel{font-size:13px;color:var(--muted)}
  .toplabel b{color:var(--fg);font-weight:650}
  .altline{font-size:13px;color:var(--muted);margin-top:12px}
  .altpill{display:inline-block;background:var(--chip);border-radius:99px;
    padding:2px 10px;margin:0 6px 6px 0;font-size:12.5px}

  .block{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .block .bt{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.4px;
    margin-bottom:8px}
  .suggest{background:var(--card2);border:1px solid var(--line);border-radius:12px;
    padding:14px;font-size:15px;line-height:1.6}
  .suggest .bt{color:var(--accent)}

  /* consistency badge */
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
    padding:4px 11px;border-radius:99px;border:1px solid transparent}
  .badge.consistent{background:var(--down-bg);color:var(--down-fg)}
  .badge.mixed{background:var(--warn-bg);color:var(--warn-fg)}
  .badge.contradictory{background:var(--up-bg);color:var(--up-fg)}
  .badge.unassessable{background:var(--chip);color:var(--muted)}
  .cnote{font-size:13px;color:var(--muted);margin-top:8px}

  .tbanner{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-fg);
    border-radius:11px;padding:9px 13px;font-size:13px;font-weight:600;margin-bottom:16px}

  /* insufficient */
  .insuf{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-fg);
    border-radius:13px;padding:16px 16px 15px}
  .insuf .ttl{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;
    margin-bottom:7px}
  .insuf .rsn{font-size:14.5px;line-height:1.55}

  /* meta strip */
  .meta{font-size:12px;color:var(--muted);margin-top:16px;padding-top:12px;
    border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 12px}

  /* -------- details / layers -------- */
  details.layer{margin-top:14px;border:1px solid var(--line);border-radius:13px;
    background:var(--card2);overflow:hidden}
  details.layer>summary{cursor:pointer;font-size:14px;font-weight:600;list-style:none;
    display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
  details.layer>summary::-webkit-details-marker{display:none}
  details.layer>summary .chev{color:var(--muted);font-weight:400;font-size:13px;
    transition:.2s}
  details.layer[open]>summary .chev{transform:rotate(180deg)}
  details.layer .body{padding:0 16px 16px}

  /* timeline */
  .tl{display:flex;flex-direction:column;gap:0}
  .tlrow{position:relative;padding:0 0 16px 20px;border-left:2px solid var(--line)}
  .tlrow:last-child{border-left-color:transparent;padding-bottom:0}
  .tlrow::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;
    border-radius:50%;background:var(--accent);border:2px solid var(--card2)}
  .tlrow.up::before{background:var(--up-fg)} .tlrow.down::before{background:var(--down-fg)}
  .tlt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
    display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .tlv{font-size:14px}
  .tla{font-size:13px;color:var(--muted);margin-top:2px}
  .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;
    background:var(--chip);color:var(--muted)}
  .tag.up{background:var(--up-bg);color:var(--up-fg)}
  .tag.down{background:var(--down-bg);color:var(--down-fg)}
  .tag.yes{background:var(--up-bg);color:var(--up-fg)}
  .tag.no{background:var(--down-bg);color:var(--down-fg)}
  .tag.maybe{background:var(--chip);color:var(--muted)}

  .ev{font-size:13px;color:var(--muted);margin:6px 0 0;padding-left:12px;
    border-left:2px solid var(--line)}
  .ev b{color:var(--fg)}
  .subttl{font-size:13px;font-weight:700;margin:16px 0 6px}
  .hyp{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:8px;
    background:var(--card)}
  .hyp .alt{font-size:14px;font-weight:600}
  .hyp .look{font-size:13px;color:var(--muted);margin-top:4px}

  pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px;
    overflow-x:auto;font-size:11.5px;line-height:1.5;max-height:56vh;margin:0}

  /* -------- feedback -------- */
  .fbcard .hint{font-size:13px;color:var(--muted);margin-bottom:11px}

  /* -------- history -------- */
  .histhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .lnk{background:none;border:1px solid var(--line);border-radius:9px;color:var(--fg);
    font:inherit;font-size:13px;padding:7px 12px;cursor:pointer;display:inline-flex;
    align-items:center;gap:5px}
  .lnk:active{transform:scale(.97)}
  .hist{font-size:14px;border-bottom:1px solid var(--line);padding:12px 0;display:block;
    text-decoration:none;color:inherit}
  .hist:last-child{border-bottom:0}
  .hist .h1{display:flex;justify-content:space-between;gap:10px}
  .hist .h2{font-size:12px;color:var(--muted);margin-top:3px}
  .hpct{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:650}

  .muted{color:var(--muted)} .ok{color:var(--ok)} .hide{display:none}
</style>
</head>
<body>
<div class="wrap">

<header>
  <span class="logo">🐾</span>
  <h1>petread</h1>
  <span class="sub">宠物行为判读</span>
</header>

<!-- ============ 进度 ============ -->
<div class="card hide" id="progcard">
  <h2 class="sec">判读中</h2>
  <progress id="bar" max="100" value="0"></progress>
  <div class="stage"><span id="stagetext">准备中…</span><span id="elapsed" class="muted"></span></div>
</div>

<!-- ============ 结果(主体) ============ -->
<div id="result"></div>

<!-- ============ 输入 ============ -->
<form id="form" class="card">
  <h2 class="sec"><span class="step">1</span>这是谁</h2>
  <div class="chips" id="species" role="group" aria-label="物种">
    <button type="button" class="chip" data-v="dog" aria-pressed="true">🐕 狗</button>
    <button type="button" class="chip" data-v="cat" aria-pressed="false">🐈 猫</button>
  </div>

  <h2 class="sec" style="margin-top:22px"><span class="step">2</span>什么场景</h2>
  <div class="chips" id="scenes" role="group" aria-label="场景标签"></div>
  <label class="blk">补充描述(越具体越准)</label>
  <textarea id="ctx" rows="2" placeholder="例:客厅,快递员按门铃,它冲到门口"></textarea>

  <h2 class="sec" style="margin-top:22px"><span class="step">3</span>素材</h2>
  <div class="chips" id="srcTabs" role="group" aria-label="素材来源" style="margin-bottom:14px">
    <button type="button" class="chip" data-src="media" aria-pressed="true">📎 上传素材</button>
    <button type="button" class="chip" data-src="text" aria-pressed="false">✍️ 文字描述</button>
  </div>

  <div id="uploadGroup">
    <label class="filebtn" id="vlabel">
      🎥 选一段视频
      <input type="file" id="video" accept="video/*">
      <div class="filename muted" id="vname">建议 5-15 秒、10MB 以内(上限 20MB;在线版过大可能被平台拒绝)</div>
    </label>
    <label class="filebtn sec" id="ilabel" style="margin-top:10px">
      📷 选一张照片(快速模式,准确度较低)
      <input type="file" id="photo" accept="image/*">
      <div class="filename" id="iname"></div>
    </label>
    <label class="filebtn sec" id="alabel" style="margin-top:10px">
      🔊 只有声音(叫声 / 呼噜,只做声学分析)
      <input type="file" id="audio" accept="audio/*">
      <div class="filename" id="aname"></div>
    </label>

    <div class="row" style="margin-top:12px">
      <span class="muted" style="font-size:13px">或直接拍摄:</span>
      <label class="minibtn">📹 录像<input type="file" id="videoCap" accept="video/*" capture="environment"></label>
      <label class="minibtn">📸 拍照<input type="file" id="photoCap" accept="image/*" capture="environment"></label>
    </div>

    <div class="row" style="margin-top:14px">
      <input type="checkbox" id="framesmode" style="width:auto">
      <label for="framesmode" class="muted" style="font-size:13px;margin:0">用抽帧链路(对比用,更慢更贵)</label>
    </div>
  </div>

  <div id="textGroup" class="hide">
    <textarea id="textdesc" rows="5" placeholder="描述你观察到的:比如耳朵位置、尾巴动作、身体姿势、有没有叫、在做什么"></textarea>
    <div class="filename muted" style="margin-top:8px">
      来不及拍就用文字。尽量写你<b>看到的动作和姿态</b>(耳朵朝向、尾巴位置、身体重心、有没有发声),
      而不只是"它好像不高兴"这类判断——越具体,判读越可靠。
    </div>
  </div>

  <div id="formerr" class="err hide"></div>
  <button class="go" id="go" type="submit" style="margin-top:16px" disabled>选择素材后开始判读</button>
</form>

<!-- ============ 历史(默认折叠) ============ -->
<details class="card" id="histcard" style="padding:0">
  <summary class="histhead" style="padding:16px 18px;cursor:pointer;list-style:none">
    <span style="font-weight:600;font-size:15px">历史记录 <span class="muted" style="font-weight:400" id="histcount"></span></span>
    <span class="row" style="gap:8px">
      <span class="lnk" id="exportbtn" role="button">⬇︎ 导出 CSV</span>
      <span class="chev muted" style="font-size:13px">▾</span>
    </span>
  </summary>
  <div style="padding:0 18px 16px">
    <div class="muted" style="font-size:12px;margin-bottom:6px">
      每条判读都会留存,作为个体校准的数据来源。点上方按钮导出全部记录与你的反馈。
    </div>
    <div id="hist" class="muted" style="font-size:14px">加载中…</div>
  </div>
</details>

</div>

<script>
"use strict";

const MAX_VIDEO_MB = 20, MAX_IMAGE_MB = 10, MAX_AUDIO_MB = 15;
const SCENES = ["吃饭前","见生人","独处","主人回家","看到其他动物","玩耍中"];
const $ = s => document.querySelector(s);
let species = "dog", picked = new Set(), file = null, fileKind = null, srcMode = "media";

/* ---------- 场景 / 物种 ---------- */
SCENES.forEach(s => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = s; b.setAttribute("aria-pressed","false");
  b.onclick = () => {
    const on = b.getAttribute("aria-pressed") === "true";
    b.setAttribute("aria-pressed", String(!on));
    on ? picked.delete(s) : picked.add(s);
  };
  $("#scenes").appendChild(b);
});
$("#species").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  [...$("#species").children].forEach(c => c.setAttribute("aria-pressed", String(c === b)));
  species = b.dataset.v;
};

/* ---------- 素材来源:上传 / 文字 ---------- */
$("#srcTabs").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  srcMode = b.dataset.src;
  [...$("#srcTabs").children].forEach(c => c.setAttribute("aria-pressed", String(c === b)));
  const isText = srcMode === "text";
  $("#uploadGroup").classList.toggle("hide", isText);
  $("#textGroup").classList.toggle("hide", !isText);
  clearErr();
  if (isText){
    // 切到文字模式:清掉已选文件,按钮状态跟随 textarea
    file = null; fileKind = null;
    updateTextGo();
  } else {
    setFile(file, fileKind);   // 回到上传模式,恢复按钮状态
  }
};
function updateTextGo(){
  const has = $("#textdesc").value.trim().length > 0;
  const go = $("#go");
  go.disabled = !has;
  go.textContent = has ? "开始判读(文字描述)" : "写下你观察到的,再开始判读";
}
$("#textdesc").addEventListener("input", () => { if (srcMode === "text") updateTextGo(); });

/* ---------- 文件选择(5 个 input,互斥) ---------- */
const KIND_LABEL = { video:"视频", image:"图片", audio:"音频" };
const KIND_LIMIT = { video:MAX_VIDEO_MB, image:MAX_IMAGE_MB, audio:MAX_AUDIO_MB };
const HINT_DEFAULT = { vname:"建议 5-15 秒、10MB 以内(上限 20MB;在线版过大可能被平台拒绝)", iname:"", aname:"" };
const INPUTS = { video:["video","vname","vlabel"], photo:["image","iname","ilabel"],
  audio:["audio","aname","alabel"], videoCap:["video","vname","vlabel"], photoCap:["image","iname","ilabel"] };

function resetPickers(exceptId){
  for (const id of Object.keys(INPUTS)){ if (id===exceptId) continue; const el=$("#"+id); if(el) el.value=""; }
  for (const [nameId,text] of Object.entries(HINT_DEFAULT)){
    const el=$("#"+nameId); if(!el) continue;
    const owner=INPUTS[exceptId]; if (owner && owner[1]===nameId) continue;
    el.textContent=text; el.classList.add("muted");
  }
  ["vlabel","ilabel","alabel"].forEach(id=>{ const o=INPUTS[exceptId]; if(!(o&&o[2]===id)) $("#"+id)?.classList.remove("has"); });
}
for (const [id,[kind,nameId,labelId]] of Object.entries(INPUTS)){
  const input=$("#"+id); if(!input) continue;
  input.onchange = () => {
    const f=input.files[0]; if(!f) return;
    const mb=f.size/1024/1024, limitMB=KIND_LIMIT[kind], nameEl=$("#"+nameId);
    if (mb>limitMB){
      showErr(`这个${KIND_LABEL[kind]} ${mb.toFixed(1)}MB,超过 ${limitMB}MB 上限。`+
        (kind==="image"?"请换一张更小的图片。":"请先裁剪(建议只保留最关键的 5-15 秒)后再上传。"));
      input.value=""; nameEl.textContent=HINT_DEFAULT[nameId]||""; nameEl.classList.add("muted"); setFile(null,null); return;
    }
    clearErr(); resetPickers(id);
    nameEl.textContent=`${f.name} · ${mb.toFixed(1)}MB`; nameEl.classList.remove("muted");
    $("#"+labelId)?.classList.add("has");
    setFile(f,kind);
  };
}
function setFile(f,kind){
  file=f; fileKind=kind; const go=$("#go");
  go.disabled=!f;
  go.textContent = !f ? "选择素材后开始判读"
    : kind==="image" ? "开始判读(快速模式)"
    : kind==="audio" ? "开始判读(仅声学分析)" : "开始判读";
  $("#framesmode").parentElement.style.display = kind==="video" ? "" : "none";
}
function showErr(m){ const e=$("#formerr"); e.textContent=m; e.classList.remove("hide"); }
function clearErr(){ $("#formerr").classList.add("hide"); }

/* ---------- 提交 ---------- */
$("#form").onsubmit = async e => {
  e.preventDefault();
  const parts=[...picked]; const free=$("#ctx").value.trim(); if(free) parts.push(free);
  const fd=new FormData(); fd.append("species",species);
  let mode;
  if(srcMode==="text"){
    const desc=$("#textdesc").value.trim();
    if(!desc){ showErr("请先写下你观察到的。"); return; }
    mode="text";
    fd.append("text",desc);
    fd.append("context",parts.join("、"));   // 场景可留空,文字里已含观察
  }else{
    if(!file) return;
    if(!parts.length){ showErr("请至少选一个场景标签,或写一句场景描述。"); return; }
    mode = fileKind==="image"?"quick":fileKind==="audio"?"audio":($("#framesmode").checked?"frames":"native");
    fd.append("file",file);
    fd.append("context",parts.join("、"));
  }
  fd.append("mode",mode);
  clearErr();

  $("#go").disabled=true; $("#result").innerHTML="";
  $("#progcard").classList.remove("hide");
  window.scrollTo({top:0,behavior:"smooth"});
  setProgress(2,"上传中…");
  const t0=Date.now();
  const tick=setInterval(()=>{ $("#elapsed").textContent=((Date.now()-t0)/1000).toFixed(0)+"s"; },250);
  try{
    const resp=await fetch("/analyze",{method:"POST",body:fd});
    if(!resp.ok || !(resp.headers.get("content-type")||"").includes("event-stream")){
      let msg=`HTTP ${resp.status}`;
      try{ const j=await resp.json(); msg=j.detail||JSON.stringify(j);}catch(_){}
      throw new Error(msg);
    }
    await readSSE(resp.body,onEvent);
  }catch(err){
    $("#progcard").classList.add("hide");
    $("#result").innerHTML=`<div class="card"><div class="err">判读失败:${esc(String(err.message||err))}</div></div>`;
  }finally{
    clearInterval(tick); $("#go").disabled=false; loadHistory();
  }
};

async function readSSE(stream,handler){
  const reader=stream.getReader(), dec=new TextDecoder(); let buf="";
  while(true){
    const {done,value}=await reader.read(); if(done) break;
    buf+=dec.decode(value,{stream:true}); let i;
    while((i=buf.indexOf("\n\n"))>=0){
      const raw=buf.slice(0,i); buf=buf.slice(i+2);
      let ev="message", data="";
      for(const line of raw.split("\n")){
        if(line.startsWith("event:")) ev=line.slice(6).trim();
        else if(line.startsWith("data:")) data+=line.slice(5).trim();
      }
      if(data){ try{ handler(ev,JSON.parse(data)); }catch(_){} }
    }
  }
}
function setProgress(p,text){ $("#bar").value=p; if(text) $("#stagetext").textContent=text; }
function onEvent(ev,d){
  if(ev==="progress") setProgress(d.percent,d.message);
  else if(ev==="heartbeat") setProgress($("#bar").value,`模型判读中… 已用 ${d.elapsed_s}s`);
  else if(ev==="error"){
    $("#progcard").classList.add("hide");
    $("#result").innerHTML=`<div class="card"><div class="err">判读失败:${esc(d.message)}</div>`+
      (d.raw?`<pre>${esc(d.raw)}</pre>`:"")+`</div>`;
  }
  else if(ev==="done"){ $("#progcard").classList.add("hide"); render(d); }
}

/* ---------- 结果渲染 ---------- */
const confColor = c => c>=0.7 ? "var(--hi)" : c>=0.55 ? "var(--mid)" : "var(--lo)";

function render(d){
  const r=d.result||{}, m=d.meta||{};
  const insuf=!!r.insufficient_evidence;
  const cands=r.candidates||[]; const top=cands[0]||null;

  let hero;
  if(insuf){
    hero=`<div class="insuf">
        <div class="ttl">⚠️ 信息不足,无法判断</div>
        <div class="rsn">${esc(r.insufficient_reason||"可用信号不足以支撑任何结论。")}</div>
      </div>`;
    if(r.suggestion) hero+=`<div class="block"><div class="suggest"><div class="bt">怎么补拍</div>${esc(r.suggestion)}</div></div>`;
  }else{
    const conf = top && typeof top.confidence==="number" ? top.confidence : null;
    const pct = conf!=null ? Math.round(conf*100) : null;
    const ring = pct!=null ? `<div class="ring" data-pct="${pct}" style="--rc:${confColor(conf)}">
        <div class="hole"><div><span class="val">${pct}%</span><div class="lbl">置信度</div></div></div>
      </div>` : "";
    hero=`<div class="heroTop">
        ${ring}
        <div class="heroText">
          <p class="verdict">${esc(r.translation||"(模型未给出翻译)")}</p>
          ${top?`<div class="toplabel">最可能:<b>${esc(top.label||"")}</b></div>`:""}
        </div>
      </div>`;
    if(cands.length>1){
      hero+=`<div class="altline">其他候选:${cands.slice(1).map(c=>
        `<span class="altpill">${esc(c.label)} ${Math.round((c.confidence||0)*100)}%</span>`).join("")}</div>`;
    }
    const cb=consistencyBadge(r); if(cb) hero+=`<div class="block">${cb}</div>`;
    if(r.suggestion) hero+=`<div class="block"><div class="suggest"><div class="bt">可以做什么</div>${esc(r.suggestion)}</div></div>`;
  }
  hero += missingBlock(r);

  // 文字模式:顶部标注可靠度有限
  const textBanner = m.mode==="text"
    ? `<div class="tbanner">📝 基于文字描述,可靠度有限 —— 拍视频更准</div>` : "";

  const meta=`<div class="meta">
      <span>${esc(m.mode)} 模式</span><span>${esc(m.model||"")}</span>
      <span>${m.latency_s}s</span><span>in ${m.tokens_in??"-"} / out ${m.tokens_out??"-"} tok</span>
      ${m.motion_features&&m.motion_features.motion_intensity&&m.motion_features.motion_intensity!=="不可观测"?`<span>运动 ${esc(m.motion_features.motion_intensity)}</span>`:""}
    </div>`;

  $("#result").innerHTML=`
    <div class="card hero">${textBanner}${hero}${meta}
      ${layerTimeline(r)}
      ${layerRaw(r)}
    </div>
    <div class="card fbcard">
      <h2 class="sec">实际情况是什么</h2>
      <div class="hint">你的判断比模型更可靠。填一句实际发生了什么,用于后续校准。</div>
      <input type="text" id="fb" placeholder="例:它其实是想出门,不是紧张">
      <button class="go" id="fbgo" style="margin-top:11px">提交反馈</button>
      <div id="fbmsg" class="muted" style="font-size:13px;margin-top:9px"></div>
    </div>`;

  // 触发置信度环动画
  requestAnimationFrame(()=>{ const rg=$("#result .ring"); if(rg) rg.style.setProperty("--pct", rg.dataset.pct); });

  $("#fbgo").onclick=async()=>{
    const v=$("#fb").value.trim();
    if(!v){ $("#fbmsg").textContent="写点什么再提交吧。"; return; }
    $("#fbgo").disabled=true;
    try{
      const resp=await fetch(`/feedback/${d.record_id}`,{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({actual_label:v,user_note:""})});
      if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
      $("#fbmsg").innerHTML=`<span class="ok">✓ 已记录,谢谢。</span>`;
      $("#fb").disabled=true; loadHistory();
    }catch(e){ $("#fbmsg").textContent="提交失败:"+e.message; $("#fbgo").disabled=false; }
  };
}

/* 缺失信号提示(主要用于文字模式) */
function missingBlock(r){
  const ms=r.missing_signals||[]; if(!ms.length) return "";
  return `<div class="block"><div class="suggest" style="border-style:dashed">
    <div class="bt">补充这些会更准</div>
    ${ms.map(x=>`<div style="margin-top:4px">· <b>${esc(x.signal||"")}</b>${x.why_it_helps?` — <span class="muted">${esc(x.why_it_helps)}</span>`:""}</div>`).join("")}
  </div></div>`;
}

/* 一致性徽章 */
function consistencyBadge(r){
  const sc=r.segment_consistency; if(!sc||!sc.agreement) return "";
  const map={consistent:["一致","consistent","跨时段一致"],mixed:["部分一致","mixed","时段间有分歧"],
    contradictory:["矛盾","contradictory","时段间冲突"],unassessable:["无法评估","unassessable","单一时间切面"]};
  const [txt,cls]=map[sc.agreement]||["—","unassessable"];
  return `<div class="bt">跨时段稳定性</div>
    <span class="badge ${cls}">${esc(txt)}</span>
    ${sc.confidence_effect?`<span class="cnote">对置信度:${esc(sc.confidence_effect)}</span>`:""}
    ${sc.note?`<div class="cnote">${esc(sc.note)}</div>`:""}`;
}

/* 第二层:时间轴 + 依据 + 反方论证 */
function layerTimeline(r){
  const tl=r.timeline||[], va=r.visual_signals||[], ae=r.audio_events||[];
  const ce=r.counter_evidence, sc=r.segment_consistency;
  const hasCounter = ce && ((ce.counter_hypotheses||[]).length || ce.note);
  if(!tl.length && !va.length && !ae.length && !hasCounter) return "";

  const rows=tl.map(t=>{
    const rng=Array.isArray(t.t_range)?`${t.t_range[0]}s – ${t.t_range[1]}s`:esc(String(t.t_range||""));
    const dir=String(t.direction||""); const cls=dir.includes("升级")?"up":dir.includes("缓解")?"down":"";
    const visualRow = va.length===0 && !t.visual ? "" : `<div class="tlv">👁 ${esc(t.visual||"—")}</div>`;
    return `<div class="tlrow ${cls}">
      <div class="tlt">${esc(rng)}${dir?`<span class="tag ${cls}">${esc(dir)}</span>`:""}</div>
      ${visualRow}
      <div class="tla">🔊 ${t.audio?esc(String(t.audio)):"无声学事件"}</div>
      ${t.motion?`<div class="tla">📈 ${esc(String(t.motion))}</div>`:""}
    </div>`;
  }).join("");

  const conflicts=(r.conflicts||[]).map(c=>
    `<div class="ev"><b>${esc((c.signals||[]).join(" ↔ "))}</b><br>${esc(c.resolution||"")}
     ${c.resolved===false?'<span class="tag up">未裁决</span>':""}</div>`).join("");

  return `<details class="layer">
    <summary>时间轴 · 依据 · 反方论证<span class="chev">▾</span></summary>
    <div class="body">
      <div class="tl">${rows||'<div class="muted" style="font-size:13px">模型未给出时间轴</div>'}</div>
      <div class="muted" style="font-size:12px;margin-top:10px">视觉记录 ${va.length} 条 · 声学事件 ${ae.length} 条</div>
      ${conflicts?`<div class="subttl">信号冲突裁决</div>${conflicts}`:""}
      ${evidenceBlock(r)}
      ${counterBlock(r)}
    </div>
  </details>`;
}

function evidenceBlock(r){
  const cs=r.candidates||[]; if(!cs.length) return "";
  return `<div class="subttl">判断依据</div>`+cs.map(c=>
    `<div style="margin-top:8px"><b>${esc(c.label)}</b> <span class="muted">${Math.round((c.confidence||0)*100)}%</span>`+
    (c.evidence||[]).map(e=>
      `<div class="ev">${esc(e.channel||"")} = ${esc(String(e.observation??""))}
       <span class="muted">@${esc(String(e.t??""))} · 置信 ${esc(e.signal_confidence||"")}</span></div>`).join("")+
    `</div>`).join("");
}

function counterBlock(r){
  const ce=r.counter_evidence; if(!ce) return "";
  const hyps=ce.counter_hypotheses||[];
  const presTag=p=>{ const s=String(p||""); return s.includes("是")?'<span class="tag yes">反方信号存在</span>'
    : s.includes("否")?'<span class="tag no">未见反方信号</span>':'<span class="tag maybe">无法确认</span>'; };
  const vmap={"成立":"no","减弱":"maybe","存疑":"yes"};
  let out=`<div class="subttl">反方论证 <span class="muted" style="font-weight:400">— 什么情况下这个判断是错的</span></div>`;
  if(!hyps.length && ce.note){ out+=`<div class="ev">${esc(ce.note)}</div>`; return out; }
  out+=hyps.map(h=>`<div class="hyp">
      <div class="alt">${esc(h.alternative||"")} ${presTag(h.present_in_media)}</div>
      ${h.would_look_like?`<div class="look">若成立本应出现:${esc(h.would_look_like)}</div>`:""}
    </div>`).join("");
  if(ce.verdict) out+=`<div class="cnote" style="margin-top:10px">排除反方后:<span class="tag ${vmap[ce.verdict]||"maybe"}">${esc(ce.verdict)}</span> ${esc(ce.note||"")}</div>`;
  return out;
}

/* 第三层:原始 JSON */
function layerRaw(r){
  return `<details class="layer"><summary>原始 JSON<span class="chev">▾</span></summary>
    <div class="body"><pre>${esc(JSON.stringify(r,null,2))}</pre></div></details>`;
}

/* ---------- 历史 ---------- */
async function loadHistory(){
  try{
    const r=await fetch("/history?limit=30"); const d=await r.json(); const items=d.items||[];
    $("#histcount").textContent = items.length ? `(${items.length})` : "";
    if(!items.length){ $("#hist").textContent="还没有记录。"; return; }
    $("#hist").innerHTML=items.map(it=>{
      const verdict = it.insufficient_evidence
        ? `<span class="muted">信息不足</span>` : esc(it.translation||it.predicted_label||"—");
      const pct = it.confidence!=null ? (it.confidence*100).toFixed(0)+"%" : "";
      return `<div class="hist">
        <div class="h1"><span>${it.species==="cat"?"🐈":"🐕"} ${verdict}</span>
          <span class="hpct muted">${pct}</span></div>
        <div class="h2">${esc(it.created_at)} · ${esc(it.mode)} · ${esc(it.context||"")}
          ${it.last_actual_label?` · <span class="ok">实际:${esc(it.last_actual_label)}</span>`:""}</div>
      </div>`;
    }).join("");
  }catch(e){ $("#hist").textContent="历史加载失败:"+e.message; }
}
$("#exportbtn").addEventListener("click", e=>{ e.preventDefault(); e.stopPropagation(); window.location.href="/export"; });

function esc(s){ return String(s??"").replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

loadHistory();
</script>
</body>
