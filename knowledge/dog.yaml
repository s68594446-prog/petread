# Dog Body Language Ladder
# 犬类可观察信号编码表 / 声学分类 / 情境修正 / 信号冲突 / 压力升级阶梯
# 用途:注入大模型 prompt 作为判读约束,不作为诊断依据。
# 编码原则:只描述可观察形态与其行为学功能,不做情绪拟人化断言。

meta:
  species: "dog"
  framework: "Dog Body Language Ladder"
  confidence_scale:
    高: "形态清晰、跨品种一致、与后续行为的关联在观察中稳定,可单独作为判读依据。"
    中: "形态可辨但受品种形态学或情境影响,需与至少一个其他通道交叉验证。"
    低: "形态多义或高度依赖情境,单独出现时不得作为结论,只能作为佐证。"
  reading_order:
    - "先读整体身体重心与肌肉张力(body_posture),它决定其余通道的解读方向。"
    - "再读距离调节意图(靠近 / 保持 / 增加距离)。"
    - "最后才读单点信号(耳、尾、嘴、眼)。"
  hard_constraints:
    - "任何单一通道都不足以判定状态,至少需要三个通道一致。"
    - "品种形态学(垂耳、断尾、卷尾、扁脸、长毛遮挡)会系统性削弱对应通道,须先降级该通道置信度。"
    - "视频分辨率不足以分辨眼白或胡须细节时,应输出'不可观测'而非推测。"

# ---------------------------------------------------------------------------
# 可观察信号编码表
# ---------------------------------------------------------------------------
signals:

  ear_position:
    confidence: "中"
    confidence_note: "立耳犬种可达高置信度;垂耳、长毛遮挡犬种耳廓位移被结构性掩盖,降为低。"
    values: ["中立", "前倾", "后压", "单耳后压", "平贴"]
    notes:
      中立: "耳基放松,耳廓朝向与头部纵轴一致。无定向注意负荷,交感唤醒处于基线水平。"
      前倾: "耳基前移、耳廓开口转向刺激源,属定向反应的一部分,常与瞳孔散大、前倾重心同时出现。指示注意力集中,不区分捕食性兴趣与威胁评估。"
      后压: "耳廓向后旋转但未贴颅。降低耳部暴露面积,常见于社交安抚接近与冲突回避,也见于高唤醒的亲和接近。"
      单耳后压: "两耳不对称,一耳定向、一耳后压。指示同时处理两个信息源或对刺激的评估未完成,常出现在状态转换的过渡期。"
      平贴: "耳廓完全贴颅、外缘与头部轮廓齐平,最大化保护耳部软组织。与防御性反应高度共现,是冲突迫近的形态学标志。"
    value_confidence:
      中立: "中"
      前倾: "中"
      后压: "低"
      单耳后压: "中"
      平贴: "高"
    caveats: "断耳、垂耳犬种的'平贴'需通过耳基位置而非耳尖位置判定。"

  tail:
    confidence: "低"
    confidence_note: "尾部是最常被误读的通道。摆动本身只指示唤醒水平,不指示效价(正/负)。必须拆成高度与摆动两个维度分别编码。"
    dimensions:

      height:
        values: ["高于背线", "与背线齐平", "略低于背线", "夹于后腿之间", "紧贴腹部"]
        notes:
          高于背线: "尾根肌群收缩上提。与自信、警戒、攻击性威胁及高唤醒兴奋均可共现,单独出现无判读价值。"
          与背线齐平: "尾根中性张力,常见于常规巡视与嗅闻探索。"
          略低于背线: "尾根轻度下压,常见于不确定情境下的信息收集阶段。"
          夹于后腿之间: "尾根强下压并内收,遮蔽会阴与肛周腺区域,减少气味信息释放。与回避动机高度关联。"
          紧贴腹部: "夹尾的极端形态,常与身体重心后移、脊柱弓起同时出现,指示强烈的距离增加动机。"
        value_confidence:
          高于背线: "低"
          与背线齐平: "低"
          略低于背线: "中"
          夹于后腿之间: "高"
          紧贴腹部: "高"

      motion:
        values: ["静止", "大幅低频摆动", "小幅高频摆动", "全身带动的髋部摆动", "仅尾尖抖动", "僵直微颤"]
        notes:
          静止: "尾部无位移。若同时伴随全身肌肉张力升高,属'僵住'的组成部分,是升级阶梯上的高位信号。"
          大幅低频摆动: "摆幅大、频率低,尾根参与,常与放松的躯干姿态共现。在三通道一致时可支持低唤醒亲和判读。"
          小幅高频摆动: "摆幅小、频率高,尾根僵硬。指示高唤醒,效价不明,常出现在紧张对峙中。"
          全身带动的髋部摆动: "尾部摆动带动骨盆与躯干侧向位移,脊柱呈 C 形。躯干整体柔软,是亲和接近中较可靠的形态。"
          仅尾尖抖动: "尾根固定、仅远端小幅位移。多见于评估期的低强度唤醒。"
          僵直微颤: "尾部高举且肌肉紧张,出现高频小幅震颤。与领地性展示、气味标记前动作共现。"
        value_confidence:
          静止: "中"
          大幅低频摆动: "低"
          小幅高频摆动: "中"
          全身带动的髋部摆动: "中"
          仅尾尖抖动: "低"
          僵直微颤: "中"
        measurement_note: "摆动频率可由运动曲线的 FFT 主频近似;需注意帧差能量在每个摆动周期内出现两次峰值,主频约为实际摆尾频率的两倍。"

    caveats: "断尾犬及卷尾犬种(如柴犬、巴哥)的高度维度不可用,应整体标记为不可观测。"

  body_posture:
    confidence: "高"
    confidence_note: "整体重心与肌肉张力是最不易被品种形态学掩盖的通道,应作为判读主轴。"
    values: ["中性站立", "重心前移", "重心后移", "低伏", "僵住", "弓背蜷缩", "翻身露腹", "play bow"]
    notes:
      中性站立: "四肢承重均匀,颈部与背线平顺,肌肉张力处于基线。"
      重心前移: "体重前移至前肢,躯干前倾。指示接近动机,可为捕食性、社交性或威胁性,须由其他通道区分。"
      重心后移: "体重后移至后肢,躯干后倾但四肢未离地。指示回避动机与随时撤离的准备状态。"
      低伏: "四肢弯曲、腹部接近地面、头部低于背线。降低自身轮廓高度,属防御性姿态。"
      僵住: "全身位移接近零且肌肉张力显著升高,呼吸变浅。是行为链中断的标志,在升级阶梯上位置高于多数位移信号。"
      弓背蜷缩: "脊柱弓起、四肢内收、尾部内夹,最大限度缩小暴露体表。与强回避动机共现。"
      翻身露腹: "侧卧或仰卧暴露腹部。形态相同但功能相反的两种情形,必须由肌肉张力区分,见 context_modifiers。"
      play bow: "前肢前伸下压、后躯抬高的定型动作。功能是标记后续动作为非严肃语境,是元交流信号。"
    value_confidence:
      中性站立: "高"
      重心前移: "中"
      重心后移: "高"
      低伏: "高"
      僵住: "高"
      弓背蜷缩: "高"
      翻身露腹: "低"
      play bow: "高"

  mouth:
    confidence: "中"
    confidence_note: "喘气受体温与运动量强烈干扰,判读前必须先排除生理性散热。唇角形态置信度显著高于喘气。"
    values: ["闭合放松", "微张喘气", "急促浅喘", "唇角后拉", "唇角前推", "露出前齿", "全齿暴露", "打战式颤抖"]
    notes:
      闭合放松: "下颌闭合、唇线平顺、无肌肉紧张。基线状态。"
      微张喘气: "下颌张开、舌部外露、呼吸节律平缓。主要为体温调节,判读价值低。"
      急促浅喘: "呼吸频率明显高于环境温度与活动量所能解释的水平,舌部可能扁平化。指示交感唤醒升高,须排除高温与剧烈运动后恢复期。"
      唇角后拉: "口角向后水平拉伸(long commissure),口裂变长。与防御性动机关联,常与后压耳、重心后移共现。"
      唇角前推: "口角向前收缩(short commissure),口裂变短、吻部皱起。与主动威胁展示关联,是距离增加请求的高强度形态。"
      露出前齿: "上唇提升暴露门齿与犬齿,通常伴随唇角前推。明确的距离增加请求。"
      全齿暴露: "上下唇同时收缩暴露全部齿列与牙龈。冲突迫近的高位信号。"
      打战式颤抖: "下颌快速小幅开合。可为体温调节、高唤醒或口腔内信息素处理(与嗅闻共现时倾向后者)。"
    value_confidence:
      闭合放松: "中"
      微张喘气: "低"
      急促浅喘: "中"
      唇角后拉: "中"
      唇角前推: "高"
      露出前齿: "高"
      全齿暴露: "高"
      打战式颤抖: "低"
    caveats: "扁脸犬种(法斗、巴哥)的唇角形态受面部结构限制,前推/后拉区分不可靠,应降为低。"

  eye:
    confidence: "中"
    confidence_note: "需要足够分辨率。视频中眼部区域小于约 20x20 像素时应标记为不可观测,不得推测。"
    dimensions:

      sclera:
        values: ["不可见", "少量可见", "whale eye"]
        notes:
          不可见: "正常状态下犬类巩膜基本不外露。"
          少量可见: "头部快速转动时的短暂外露,无判读价值。"
          whale eye: "头部保持朝向不变、眼球侧向转动,巩膜在虹膜一侧持续外露呈月牙形。指示个体在监视某对象的同时不愿正面朝向它,是回避与监视并存的状态,在升级阶梯上位置较高。"
        value_confidence:
          不可见: "中"
          少量可见: "低"
          whale eye: "高"

      pupil:
        values: ["常态", "散大"]
        notes:
          常态: "与环境照度相称。"
          散大: "在照度不变的前提下瞳孔直径增大,反映交感神经激活。不区分唤醒的效价。"
        value_confidence:
          常态: "中"
          散大: "中"
        caveats: "照度变化、虹膜色素深的个体、逆光拍摄均会使该维度不可用。"

      gaze:
        values: ["软性扫视", "回避性转开", "定向注视", "僵直凝视"]
        notes:
          软性扫视: "眼球频繁小幅移动、眨眼频率正常、眼周肌肉放松。基线状态。"
          回避性转开: "主动将视线移离对象,常与头部转开同时出现。是低位安定信号,功能为降低冲突概率。"
          定向注视: "视线稳定锁定对象,眨眼频率下降。指示注意集中,效价不明。"
          僵直凝视: "视线锁定且眼周肌肉紧张、瞬目抑制,常与身体僵住共现。冲突迫近的高位信号。"
        value_confidence:
          软性扫视: "中"
          回避性转开: "中"
          定向注视: "中"
          僵直凝视: "高"

  displacement_signals:
    confidence: "中"
    confidence_note: "位移行为的判读关键在于'语境不匹配'——动作本身正常,出现时机不合理才有信息量。孤立一次出现无判读价值,需看密度。"
    definition: "指在动机冲突下出现的、与当前语境功能无关的常规行为片段。功能上兼具自我调节与向对方降低冲突压力。"
    values: ["舔鼻", "打哈欠", "抖毛", "嗅地", "抓挠", "急速甩头", "定点自我舔舐", "转身走开", "蹲坐/趴下"]
    notes:
      舔鼻: "舌尖快速掠过鼻镜。判读前提是不存在进食、饮水或口鼻沾湿。是密度最高、最早出现的低位信号之一。"
      打哈欠: "缓慢的大幅张口。判读前提是不存在困倦或刚睡醒。压力性哈欠通常张口时长更长、幅度更大。"
      抖毛: "从头部起始向尾部传导的全身抖动。判读前提是被毛干燥无异物。常出现在一段紧张互动结束的瞬间,可作为唤醒下降的时间标记。"
      嗅地: "突然低头嗅闻地面。判读前提是该处无明显气味源,且行为发生在社交压力升高的时刻。功能为中断对视与延缓接近。"
      抓挠: "后肢抓挠身体。判读前提是不存在皮肤问题或体外寄生虫。"
      急速甩头: "头部快速侧向甩动。需排除耳部不适。"
      定点自我舔舐: "对同一部位(常为前肢腕部)持续舔舐。高频反复出现时提示慢性压力,超出单次视频判读范围。"
      转身走开: "主动增加与刺激源的距离。功能明确的距离调节行为,不是'不听指令'。"
      蹲坐/趴下: "在被接近时主动降低姿态并停止移动。功能为减少刺激对方的动作输入。"
    value_confidence:
      舔鼻: "中"
      打哈欠: "中"
      抖毛: "中"
      嗅地: "中"
      抓挠: "低"
      急速甩头: "低"
      定点自我舔舐: "低"
      转身走开: "高"
      蹲坐/趴下: "中"
    density_rule: "单个 10 秒窗口内出现 3 次以上不同类别的位移信号,即使每一次单独看都可解释,也应整体判为压力升高。"

# ---------------------------------------------------------------------------
# 声学分类
# f0_range 单位 Hz,[下界, 上界],null 表示该侧不设界。数值为形态学粗分档,
# 存在个体与体型差异(大型犬整体偏低),不作精确阈值使用。
# ---------------------------------------------------------------------------
acoustic:

  - pattern: "低频单音长吠"
    f0_range: [null, 300]
    duration_s: [0.3, 1.0]
    context: "威胁/警戒"
    confidence: "中"
    notes: "单次发声时长较长、音节间隔大、谐波结构清晰。低频与大体型的声道长度相关,在跨物种通信中与'发声者体积大'的印象一致。须与体型基线对照,小型犬的低频吠叫更具判读价值。"

  - pattern: "高频多音节短吠"
    f0_range: [800, null]
    duration_s: [0.05, 0.2]
    context: "兴奋/求关注"
    confidence: "中"
    notes: "单音节短、重复率高、音节间隔小。常见于社交接近前的高唤醒状态与资源期待,不指示威胁。"

  - pattern: "中频连续串吠"
    f0_range: [300, 800]
    duration_s: [0.1, 0.4]
    context: "警报/远距离呼叫"
    confidence: "中"
    notes: "持续时间长、节律稳定的连续发声。功能为向同伴传递刺激存在,重复率随刺激接近而升高。"

  - pattern: "低吼"
    f0_range: [null, 250]
    duration_s: [0.5, 3.0]
    context: "距离增加请求"
    confidence: "高"
    notes: "连续、低频、带明显噪声成分的发声,常伴随唇角前推。功能明确且不含歧义:请求对方停止接近。是行为链中的警告环节,抑制该信号会移除后续咬合前的预警。"

  - pattern: "玩耍性低吼"
    f0_range: [200, 500]
    duration_s: [0.2, 1.0]
    context: "玩耍中的非严肃威胁"
    confidence: "低"
    notes: "声学上与威胁性低吼部分重叠,f0 略高、节律更断续。必须依赖视觉通道(play bow、躯干松弛、动作夸张化与角色互换)才能区分,单靠音频不可判定。"

  - pattern: "呜咽/哀鸣"
    f0_range: [400, 1200]
    duration_s: [0.2, 2.0]
    context: "求助/挫折/疼痛"
    confidence: "中"
    notes: "音调上扬或起伏的窄带发声。功能为引发接近与照护反应。若与运动受限、局部舔舐共现,应优先考虑躯体不适而非社交需求。"

  - pattern: "嚎叫"
    f0_range: [200, 900]
    duration_s: [1.0, 5.0]
    context: "远距离社会联络"
    confidence: "中"
    notes: "时长最长、频率随时间平滑滑动的发声。传播距离远,功能为定位同伴或应答同类频率的声源(含警报器、乐器)。不指示痛苦。"

  - pattern: "尖叫"
    f0_range: [1000, null]
    duration_s: [0.05, 0.5]
    context: "急性疼痛/惊吓"
    confidence: "高"
    notes: "起始陡峭的高频爆发,常为单次或短串。与突发性伤害刺激时间上紧密耦合,是本表中时间定位最可靠的声学事件。"

  - pattern: "喘息式短促发声"
    f0_range: [300, 1000]
    duration_s: [0.05, 0.15]
    context: "玩耍邀请"
    confidence: "低"
    notes: "混在喘气中的断续送气音,能量低、易被环境噪声掩盖。在低质量录音中不应尝试识别。"

# ---------------------------------------------------------------------------
# 情境修正:同一形态在不同情境下功能相反的情形
# ---------------------------------------------------------------------------
context_modifiers:

  - signal: "露出腹部"
    default: "放松"
    default_note: "肌肉松弛、四肢自然张开、呼吸平缓、头部随意搁置,常见于休息或索求触摸。"
    override_when: "身体僵直 + 尾巴夹紧 + 头部偏转"
    override_to: "极度紧张的顺从姿态"
    override_note: "形态相同但肌肉张力相反。此时暴露腹部是抑制对方进一步动作的策略,不是邀请触摸。在此状态下触摸腹部会显著提高冲突概率。"
    confidence: "高"

  - signal: "喘气"
    default: "体温调节"
    override_when: "环境温度适中 + 无近期运动 + 伴随急促浅促与瞳孔散大"
    override_to: "交感唤醒升高"
    confidence: "中"

  - signal: "尾巴摆动"
    default: "唤醒升高"
    default_note: "摆动只指示唤醒水平,不指示效价。默认解读即应为中性。"
    override_when: "摆幅小、频率高、尾根僵硬 + 躯干张力升高"
    override_to: "紧张性高唤醒"
    confidence: "中"

  - signal: "接近并跳起搭前肢"
    default: "社交接近"
    override_when: "耳后压 + 唇角后拉 + 反复中断接近"
    override_to: "冲突动机下的试探性接近"
    confidence: "低"

  - signal: "低伏前肢下压"
    default: "play bow 玩耍邀请"
    override_when: "视线锁定 + 身体静止 + 后躯未抬高"
    override_to: "捕食序列中的潜伏"
    override_note: "两者形态接近,关键区别在后躯高度、动作是否具有夸张的弹跳节律,以及视线是否锁定。"
    confidence: "中"

  - signal: "转身走开"
    default: "距离调节/安定信号"
    override_when: "存在明确的环境诱因(食物、其他个体)且移动为定向直线"
    override_to: "目标导向移动,无社交信息量"
    confidence: "中"

  - signal: "打哈欠"
    default: "压力性位移信号"
    override_when: "刚从睡眠中醒来 + 伴随伸展动作"
    override_to: "生理性哈欠,无判读价值"
    confidence: "中"

# ---------------------------------------------------------------------------
# 信号冲突处理:多通道不一致时的裁决规则
# ---------------------------------------------------------------------------
conflict_rules:

  - conflicting: ["尾巴摆动", "耳朵后压"]
    resolution: "尾巴摆动不等于友好。看摆动幅度与身体张力:小幅高频 + 尾根僵硬 + 耳后压,倾向判为矛盾/焦虑而非亲和。"
    priority: "以躯干肌肉张力为准"
    confidence: "中"

  - conflicting: ["接近动作", "重心后移"]
    resolution: "身体前后分离(前端接近、后端后撤)是典型的趋避冲突形态。判为动机冲突,不判为接近意愿。"
    priority: "以重心为准"
    confidence: "高"

  - conflicting: ["play bow", "僵直凝视"]
    resolution: "元交流信号被僵住打断时,玩耍框架已经解除。以僵住为准,判为玩耍升级为紧张对峙。"
    priority: "以后出现的信号为准"
    confidence: "高"

  - conflicting: ["低吼", "尾巴大幅摆动"]
    resolution: "不因摆尾而弱化低吼。低吼是明确的距离增加请求,置信度高于尾部通道,应以低吼为准。"
    priority: "以高置信度通道为准"
    confidence: "高"

  - conflicting: ["翻身露腹", "全身僵直"]
    resolution: "见 context_modifiers 的露出腹部条目,按顺从姿态处理,不按放松处理。"
    priority: "以肌肉张力为准"
    confidence: "高"

  - conflicting: ["喘气", "低环境温度"]
    resolution: "排除体温调节解释后,喘气归入唤醒指标。"
    priority: "以情境证据为准"
    confidence: "中"

  - conflicting: ["尾巴高举", "耳朵平贴"]
    resolution: "尾高与耳贴同现指示高唤醒下的防御性状态,不判为自信。以耳部通道为准,因其置信度更高。"
    priority: "以高置信度通道为准"
    confidence: "中"

  - conflicting: ["位移信号密度高", "整体姿态放松"]
    resolution: "位移信号在时间上先于姿态变化。密度规则触发时应判为压力上升的早期阶段,即使姿态尚未改变。"
    priority: "以位移信号为准"
    confidence: "中"

# ---------------------------------------------------------------------------
# 压力升级阶梯:从低强度距离调节到咬合
# 阶梯不必逐级出现;既往被惩罚过预警信号的个体可能跳过中间层级。
# ---------------------------------------------------------------------------
escalation_ladder:

  - level: 1
    label: "低强度安定信号"
    signals: ["转头", "舔鼻", "打哈欠", "眨眼频率升高"]
    notes: "成本最低的距离调节尝试,极易被观察者忽略。此层级出现时移除压力源,冲突概率下降最明显。"
    confidence: "中"

  - level: 2
    label: "主动脱离"
    signals: ["转身走开", "抖毛", "嗅地", "蹲坐或趴下", "假装对他物感兴趣"]
    notes: "个体主动增加距离或中断互动。此层级被阻断(如牵引绳限制、被追随)会直接推动升级。"
    confidence: "中"

  - level: 3
    label: "防御性姿态"
    signals: ["低伏", "重心后移", "尾巴夹紧", "耳朵后压", "whale eye", "唇角后拉"]
    notes: "个体已判定无法脱离,转为降低暴露面。此层级仍无攻击意图,但触摸与接近的风险已显著升高。"
    confidence: "高"

  - level: 4
    label: "僵住"
    signals: ["全身位移接近零", "呼吸变浅", "僵直凝视", "瞬目抑制"]
    notes: "行为链中断,是阶梯上最关键的转折点。误读为'冷静下来了'是常见且高风险的错误。"
    confidence: "高"

  - level: 5
    label: "明示警告"
    signals: ["低吼", "唇角前推", "露出前齿", "全齿暴露", "鼻梁皱起"]
    notes: "明确的距离增加请求。惩罚此层级会使个体在后续情境中跳过警告直接进入下一级,应始终视为需要保留的信息。"
    confidence: "高"

  - level: 6
    label: "空咬与推挤"
    signals: ["空咬(牙齿闭合但未接触)", "用鼻吻部猛推", "快速前扑后立即撤回"]
    notes: "具备完整咬合能力但主动控制了接触,属最后一次警告。距离未被恢复则进入下一级。"
    confidence: "高"

  - level: 7
    label: "咬合"
    signals: ["接触性咬合", "持续咬握", "反复咬击"]
    notes: "咬合抑制程度(是否留痕、是否破皮、是否持续)反映的是控制水平而非动机强度,记录时应分别描述。"
    confidence: "高"

# ---------------------------------------------------------------------------
# 输出约束:供 prompt 直接引用
# ---------------------------------------------------------------------------
output_constraints:
  - "对每个判读结论必须列出所依据的通道,以及各通道的置信度等级。"
  - "通道不可观测时输出'不可观测',不得由其他通道推测其取值。"
  - "低置信度通道不得单独支撑结论。"
  - "涉及疼痛、疾病或持续性行为问题的迹象,只描述观察到的形态,并建议由执业兽医或行为专业人员评估。"
