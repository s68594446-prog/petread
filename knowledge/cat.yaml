# Cat Ethogram
# 猫科可观察信号编码表 / 声学分类 / 情境修正 / 信号冲突 / 压力升级阶梯
# 用途:注入大模型 prompt 作为判读约束,不作为诊断依据。
# 编码原则:只描述可观察形态与其行为学功能,不做情绪拟人化断言。

meta:
  species: "cat"
  framework: "Cat Ethogram"
  confidence_scale:
    高: "形态清晰、跨个体一致、与后续行为的关联在观察中稳定,可单独作为判读依据。"
    中: "形态可辨但受品种形态学或情境影响,需与至少一个其他通道交叉验证。"
    低: "形态多义或高度依赖情境,单独出现时不得作为结论,只能作为佐证。"
  species_notes:
    - "猫是兼具捕食者与被捕食者角色的独居性狩猎动物,其信号系统以近距离、低成本、可撤回为特征,整体幅度远小于犬类。"
    - "多数亲和信号(slow blink、bunting、kneading)是主动发出且可被中断的,被动接受触摸不等于接受。"
    - "对人发出的 meow 在成年个体的同类交流中极少出现,应作为种间沟通行为编码,不可套用同类交流的解释。"
  reading_order:
    - "先读体态与空间选择(是否可撤离、是否被围堵),它决定其余通道的解读方向。"
    - "再读耳与胡须(唤醒与定向)。"
    - "最后读尾与瞳孔,这两个通道单独使用时误判率最高。"
  hard_constraints:
    - "任何单一通道都不足以判定状态,至少需要三个通道一致。"
    - "折耳、无毛、短尾(曼岛猫)、扁脸(波斯)等品种会系统性掩盖对应通道,须先降级该通道置信度。"
    - "瞳孔通道在照度未知或变化时不可用。"
    - "长毛个体的胡须与体表轮廓可能不可辨,应标记为不可观测。"

# ---------------------------------------------------------------------------
# 可观察信号编码表
# ---------------------------------------------------------------------------
signals:

  ear_position:
    confidence: "高"
    confidence_note: "猫的耳廓可独立旋转近 180 度,是分辨率最高、最不易误读的通道之一。折耳品种除外。"
    values: ["中立前向", "单耳侧转", "双耳侧转", "飞机耳", "完全平贴", "高频抽动"]
    notes:
      中立前向: "耳廓开口朝前、耳基放松。基线状态,无定向负荷。"
      单耳侧转: "一耳保持前向、一耳独立转向侧后方声源。指示同时监听两个方位,属常规环境扫描,不指示紧张。"
      双耳侧转: "两耳同时向外侧旋转,耳廓开口朝向侧方。唤醒升高与不确定性的早期标志,是升级阶梯上的低位信号。"
      飞机耳: "耳廓向外侧旋转并下压,耳背朝向前方,从正面看呈水平展开的机翼状。是防御性唤醒的明确形态,常与胡须后收、身体重心降低共现。"
      完全平贴: "耳廓向后下方压至贴颅,最大限度保护耳部软组织。冲突迫近的高位信号,与攻击或防御的即时准备状态共现。"
      高频抽动: "耳廓小幅快速抖动。可为对声源的持续定向,也可为耳部不适,需排除后者。"
    value_confidence:
      中立前向: "高"
      单耳侧转: "中"
      双耳侧转: "中"
      飞机耳: "高"
      完全平贴: "高"
      高频抽动: "低"
    caveats: "苏格兰折耳猫的耳廓结构使全部取值不可用,应整体标记为不可观测。"

  tail:
    confidence: "中"
    confidence_note: "猫的尾部信号比犬类更具判读价值,但仍须拆成位置与运动两个维度。竖直尾是少数可较可靠单独使用的形态。"
    dimensions:

      position:
        values: ["竖直", "问号尾", "水平后伸", "低垂", "夹于腹下", "炸毛竖直", "缠绕对方"]
        notes:
          竖直: "尾部垂直上举、尾尖不弯。是猫科在近距离亲和接近中的主要视觉信号,常出现在接近对方之前,功能为预告非敌意接近。在家猫的同类与种间互动中均稳定出现。"
          问号尾: "尾部上举且远端弯曲呈钩状。在竖直尾基础上叠加更高的接近意愿,常与小跑接近共现。"
          水平后伸: "尾部与背线大致齐平后伸。常见于探索与常规移动,判读价值低。"
          低垂: "尾部低于背线但未内收。可为放松站立,也可为不确定,须结合体态。"
          夹于腹下: "尾部内收贴近腹侧或后腿之间。指示强回避动机,是防御序列的组成部分。"
          炸毛竖直: "竖毛肌收缩使尾部毛发直立,尾体可能同时呈倒 U 形。功能是瞬间放大视觉轮廓,属自主神经反应,不受随意控制,因此不会伪装。"
          缠绕对方: "尾部主动搭绕在另一个体身上。是亲和性触觉接触,在稳定的社会关系中出现。"
        value_confidence:
          竖直: "高"
          问号尾: "高"
          水平后伸: "低"
          低垂: "低"
          夹于腹下: "高"
          炸毛竖直: "高"
          缠绕对方: "高"

      motion:
        values: ["静止", "尾尖轻弹", "大幅拍打", "整尾左右摆动", "颤抖尾", "缓慢波状摆动"]
        notes:
          静止: "无位移。结合放松体态为基线,结合僵直体态则属僵住的组成部分。"
          尾尖轻弹: "仅远端小幅快速位移。指示唤醒升高的早期阶段,常在触摸互动中先于撤离出现,是可用于预警的时间标记。"
          大幅拍打: "整尾大幅、有力地击打地面或体侧。指示唤醒显著升高与冲突动机,与犬类摆尾功能相反,不可套用。"
          整尾左右摆动: "尾体中段以上参与的中幅摆动。多见于捕猎前的定位阶段与高唤醒专注。"
          颤抖尾: "尾部上举并出现高频小幅震颤。与高唤醒的亲和接近共现(如迎接);相同形态也见于喷尿标记动作,须看后躯是否同时抬高并背向垂直面。"
          缓慢波状摆动: "低频大幅的柔缓摆动,常见于半睡半醒的躺卧状态,判读价值低。"
        value_confidence:
          静止: "中"
          尾尖轻弹: "高"
          大幅拍打: "高"
          整尾左右摆动: "中"
          颤抖尾: "中"
          缓慢波状摆动: "低"
        measurement_note: "尾部摆动频率可由运动曲线的 FFT 主频近似;帧差能量在每个摆动周期内出现两次峰值,主频约为实际摆尾频率的两倍。"

    caveats: "曼岛猫及断尾个体的该通道整体不可用。"

  pupil:
    confidence: "低"
    confidence_note: "猫的瞳孔对照度极度敏感,变化幅度远大于犬类。除非能确认照度恒定,否则该通道不应参与判读。"
    values: ["纵向裂隙", "中度椭圆", "完全散大"]
    notes:
      纵向裂隙: "强光下的正常收缩形态。在照度低而瞳孔仍收缩时,才提示交感激活下的定向状态。"
      中度椭圆: "常态照度下的中间形态,无判读价值。"
      完全散大: "瞳孔近圆形且占据大部分虹膜。在照度未降低的前提下指示交感激活,不区分唤醒效价,捕猎、惊吓、玩耍均可出现。"
    value_confidence:
      纵向裂隙: "低"
      中度椭圆: "低"
      完全散大: "中"
    caveats: "室内暖光、逆光、低分辨率视频均使该通道不可用。判读前必须先确认照度条件。"

  whisker_position:
    confidence: "中"
    confidence_note: "触须由随意肌控制且反应快,信息量高,但对视频分辨率与拍摄角度要求高。侧面视角下可用性最好。"
    values: ["自然侧展", "前伸扇开", "后收贴颊", "下垂"]
    notes:
      自然侧展: "触须向两侧自然展开,基线状态。"
      前伸扇开: "触须向前方推出并扇形展开,增大触觉采样范围。与近距离探查、捕猎接触阶段、高度专注共现。"
      后收贴颊: "触须向后收拢贴近面颊,缩小面部前方轮廓。与防御性唤醒共现,常与飞机耳同时出现,是较可靠的组合。"
      下垂: "触须失去张力自然下垂。常见于低唤醒休息状态,也见于全身性不适,须结合活动量判断。"
    value_confidence:
      自然侧展: "中"
      前伸扇开: "中"
      后收贴颊: "高"
      下垂: "低"
    caveats: "无毛品种与触须被修剪的个体不可用;正面平视角度下位移不可辨。"

  body_posture:
    confidence: "高"
    confidence_note: "体态与空间选择是最稳定的通道,应作为判读主轴。特别注意个体是否具备可撤离路径。"
    values: ["放松侧卧", "面包坐姿", "蜷缩收拢", "低伏蹲踞", "弓背侧身", "僵直站立", "翻身仰卧露腹", "半蹲后撤"]
    notes:
      放松侧卧: "躯干侧倒、四肢伸展、腹部部分暴露、肌肉松弛。低唤醒状态,是本表中最明确的放松形态。"
      面包坐姿: "四肢收于身下、尾部环绕、躯干直立。保存体温的常规休息姿势;若同时伴随体态收紧与瞬目减少,也见于不适或低度警戒,须结合面部通道。"
      蜷缩收拢: "四肢与尾部紧收、脊柱弓起、头部低垂内收。缩小暴露体表,与回避动机及躯体不适均可关联。"
      低伏蹲踞: "腹部贴近地面、四肢屈曲随时可弹起、重心压低。捕猎潜伏与防御准备共用此形态,由视线与胡须区分。"
      弓背侧身: "脊柱弓起、身体侧向对方、四肢伸直、被毛竖立。功能是最大化视觉轮廓,属防御性威吓展示,不指示主动攻击意图。"
      僵直站立: "四肢承重、全身位移接近零、肌肉张力升高。行为链中断的标志,是阶梯上的关键转折点。"
      翻身仰卧露腹: "背部着地、四肢朝上。形态相同但功能相反的两种情形,须由肌肉张力区分,见 context_modifiers。"
      半蹲后撤: "重心后移、后肢屈曲、头部后仰。指示即将撤离或即将用前爪拍击。"
    value_confidence:
      放松侧卧: "高"
      面包坐姿: "低"
      蜷缩收拢: "中"
      低伏蹲踞: "中"
      弓背侧身: "高"
      僵直站立: "高"
      翻身仰卧露腹: "低"
      半蹲后撤: "高"

  affiliative_signals:
    confidence: "中"
    confidence_note: "亲和信号的判读关键是'由谁发起'。个体主动发出时信息量高;被动承受触摸不构成亲和信号。"
    values: ["slow blink", "bunting", "kneading", "allogrooming", "tail wrap", "并卧接触", "主动露出体侧"]
    notes:
      slow blink: "缓慢闭合眼睑并停留后再睁开,常连续出现。功能为解除对视带来的对峙压力,是非威胁意图的信号。人主动发出时可观察到部分个体回应相同形态。"
      bunting: "用额头、颊部或下颌摩擦对象。该部位有皮脂腺分布,行为兼具气味标记与社会性接触功能。指向对象的选择性高,不会随机发出。"
      kneading: "前爪交替按压柔软表面,常伴随 purr 与部分个体的流涎。源自幼年期哺乳时刺激乳汁分泌的动作模式,在成年个体中于高度放松时保留出现。"
      allogrooming: "舔舐另一个体的头颈部。多发生在关系稳定的个体之间,梳理部位集中于对方难以自舔的区域。"
      tail wrap: "尾部搭绕在另一个体身上,见 tail 通道。"
      并卧接触: "长时间躯干接触的共同休息。是社会关系亲密度较可靠的指标,因其成本高且可随时终止。"
      主动露出体侧: "主动将侧腹转向对方并停留。与被围堵时的被动翻倒不同,关键在于是否为主动位移。"
    value_confidence:
      slow blink: "中"
      bunting: "高"
      kneading: "高"
      allogrooming: "高"
      tail wrap: "高"
      并卧接触: "高"
      主动露出体侧: "中"

  displacement_signals:
    confidence: "中"
    confidence_note: "判读关键在于'语境不匹配'——动作本身正常,出现时机不合理才有信息量。孤立一次出现无判读价值,需看密度。"
    definition: "指在动机冲突下出现的、与当前语境功能无关的常规行为片段,兼具自我调节功能。"
    values: ["突发性自我舔舐", "舔鼻", "抖毛", "打哈欠", "抓挠", "假装梳理", "转头回避", "过度梳理单一部位"]
    notes:
      突发性自我舔舐: "在社交压力升高的瞬间突然开始梳理体表。判读前提是被毛无异物。是猫最典型的位移行为。"
      舔鼻: "舌尖掠过鼻镜,判读前提是不存在进食或饮水。"
      抖毛: "全身抖动,常出现在一段紧张互动结束的瞬间,可作为唤醒下降的时间标记。"
      打哈欠: "判读前提是不存在困倦或刚睡醒。"
      抓挠: "后肢抓挠,需排除皮肤问题与体外寄生虫。"
      假装梳理: "梳理动作起始后迅速中断,舌与被毛未实际接触。动作不完整是与真实梳理的区分点。"
      转头回避: "主动将视线与面部转离对象,是低位安定信号。"
      过度梳理单一部位: "对同一部位持续舔舐至被毛稀疏。提示慢性压力或局部躯体不适,超出单次视频判读范围,应转由兽医评估。"
    value_confidence:
      突发性自我舔舐: "中"
      舔鼻: "中"
      抖毛: "中"
      打哈欠: "低"
      抓挠: "低"
      假装梳理: "中"
      转头回避: "中"
      过度梳理单一部位: "低"
    density_rule: "单个 10 秒窗口内出现 3 次以上不同类别的位移信号,即使每一次单独看都可解释,也应整体判为压力升高。"

# ---------------------------------------------------------------------------
# 声学分类
# f0_range 单位 Hz,[下界, 上界],null 表示该侧不设界或无明确基频。
# 数值为形态学粗分档,存在个体差异,不作精确阈值使用。
# ---------------------------------------------------------------------------
acoustic:

  - pattern: "purr"
    f0_range: [25, 30]
    duration_s: [0.5, null]
    context: "低唤醒接触 / 自我安抚"
    confidence: "低"
    notes: "由喉部肌群周期性收缩产生的持续低频振动,吸气与呼气相均可维持。不专属于放松状态:在分娩、受伤、就诊与临终情境中同样出现,因此单独出现不能判为舒适。低频成分常低于普通麦克风与视频压缩的有效响应下限,音频中缺失不等于未发生。"

  - pattern: "meow"
    f0_range: [700, 800]
    duration_s: [0.3, 1.5]
    context: "对人的定向请求"
    confidence: "中"
    notes: "成年个体之间几乎不使用,主要在种间沟通中发出,且发声结构在个体与其固定照护者之间存在长期塑造。功能为引发接近或获取资源,不指示具体需求内容,须由指向对象与移动路径推断。"

  - pattern: "solicitation purr"
    f0_range: [25, 30]
    duration_s: [1.0, null]
    context: "取食请求"
    confidence: "低"
    notes: "在 purr 的低频基底上嵌入一段数百赫兹的窄带高频成分,听感上更具穿透力。与普通 purr 的区分依赖频谱分析,听觉判断不可靠。"

  - pattern: "chirp / trill"
    f0_range: [400, 1600]
    duration_s: [0.1, 0.5]
    context: "亲和性招呼 / 幼崽召唤"
    confidence: "中"
    notes: "闭口发出的短促上扬颤音。多见于母猫召唤幼崽及个体间的友好接近,也见于对人的问候。与 meow 的区分点是口部保持闭合、时长更短。"

  - pattern: "hiss"
    f0_range: [null, null]
    duration_s: [0.3, 1.5]
    context: "距离增加请求"
    confidence: "高"
    notes: "口部张开、经声门快速排气产生的宽带噪声,无明确基频。是防御性信号而非攻击宣告,功能明确且不含歧义:请求对方停止接近。常与飞机耳、后收胡须同时出现。惩罚该信号会移除后续拍击或咬合前的预警。"

  - pattern: "growl"
    f0_range: [100, 400]
    duration_s: [1.0, 4.0]
    context: "持续性威慑"
    confidence: "高"
    notes: "低频、时长较长、带噪声成分的连续发声,常在 hiss 之后持续。指示对峙尚未解除。"

  - pattern: "yowl"
    f0_range: [200, 600]
    duration_s: [1.0, 5.0]
    context: "远距离对峙 / 繁殖相关 / 定向障碍"
    confidence: "中"
    notes: "音调起伏、时长最长的发声。在未绝育个体的繁殖季、个体间领地对峙,以及老年个体夜间定向障碍中均出现。判读高度依赖情境与个体信息,单靠声学特征不可区分。"

  - pattern: "caterwaul"
    f0_range: [300, 800]
    duration_s: [2.0, null]
    context: "高强度对峙升级"
    confidence: "中"
    notes: "由 yowl 演变的高强度反复发声,通常出现在肢体冲突前的最后阶段。"

  - pattern: "pain shriek"
    f0_range: [1000, null]
    duration_s: [0.1, 0.6]
    context: "急性疼痛 / 惊吓"
    confidence: "高"
    notes: "起始陡峭的高频爆发,与突发性伤害刺激时间上紧密耦合,是本表中时间定位最可靠的声学事件。"

  - pattern: "chatter"
    f0_range: [null, null]
    duration_s: [0.2, 2.0]
    context: "对不可接近猎物的高唤醒反应"
    confidence: "中"
    notes: "下颌快速开合产生的断续咯咯声,常伴随微弱发声,多见于隔窗观察鸟类时。属高唤醒下的捕猎动作模式片段,不指示挫折以外的具体状态。"

# ---------------------------------------------------------------------------
# 行为模式:用户口语描述的【复合动作】与编码表之间的中间层
#
# 上面的 signals 编码的是【静态原子信号】(飞机耳、尾巴拍打),而用户描述的往往是
# 【行为】("抱着我的手咬""追自己尾巴")。缺这一层时,文字/图片模式无法把描述映射到
# 编码表,只能全标"不可观测"→ 系统性误判为证据不足。
#
# 用法:命中 typical_phrases 即可按 candidates 并列出候选(不硬选一个),置信度不超过
# confidence_cap;distinguishing_signals 指出区分候选所需的通道,应写进 missing_signals。
# 行为模式本身是【低置信度入口】,不替代信号编码,更不足以单独定论。
# ---------------------------------------------------------------------------
behavior_patterns:

  - pattern: "抱咬+后腿踢(bunny kick)"
    typical_phrases: ["抱着手咬", "抱着腿咬", "搂住咬还踢", "抱住兔子踢", "抱着我的胳膊啃", "两只前爪抱住咬后腿蹬"]
    candidates: ["捕猎性玩耍 / 过度刺激", "防御性反击"]
    confidence_cap: 0.6
    distinguishing_signals:
      - "ear_position: 中立前向 → 偏玩耍;飞机耳/完全平贴 → 偏防御"
      - "发声: 有 hiss/growl/pain shriek → 防御或疼痛;无声 → 玩耍"
      - "前置情境: 刚被长时间抚摸 → 过度刺激的可能升高"
      - "力度与收放: 齿列未闭合/爪未伸出、可反复松开重来 → 玩耍;一次性用力咬握不松 → 防御"
    notes: "猫抱咬+后腿踢是典型捕猎动作模式,对人时多为玩耍或过度刺激;孤立一次不诊断为攻击性。若长期以手作为玩具,该模式会被强化,应改用逗猫棒等有距离的玩具。"

  - pattern: "扑咬手/脚"
    typical_phrases: ["突然扑上来咬手", "咬脚踝", "躲在角落偷袭", "路过就扑我的脚", "冲出来抱住手咬"]
    candidates: ["捕猎性玩耍(移动目标触发)", "玩耍需求未被满足的动作释放"]
    confidence_cap: 0.6
    distinguishing_signals:
      - "body_posture: 低伏蹲踞 + 后躯摆动后弹出 → 完整捕猎序列"
      - "ear_position: 中立前向/前倾 → 捕猎性;飞机耳 → 需重新考虑防御"
      - "发声: 通常无声;出现 hiss/growl 则不属此模式"
      - "前置情境: 目标是否为快速移动的手脚;独处时长与当日消耗量"
    notes: "移动的手脚触发捕猎序列,是正常动作模式而非攻击性;孤立一次不诊断。判读重点是玩耍消耗是否充足,而非个体是否'有攻击性'。"

  - pattern: "追/咬自己尾巴"
    typical_phrases: ["追自己的尾巴", "转圈咬尾巴", "咬自己尾巴尖", "绕着圈追尾"]
    candidates: ["幼年期捕猎动作模式(玩耍)", "躯体不适或皮肤问题引发的定向舔咬"]
    confidence_cap: 0.55
    distinguishing_signals:
      - "频率与可中断性: 偶发且能被外界打断 → 偏玩耍;高频反复、难以打断 → 偏躯体或行为问题"
      - "局部形态: 尾部是否有脱毛、破损、红肿(需要看清尾部)"
      - "发声: 出现 growl/pain shriek → 优先考虑疼痛"
      - "年龄与病史: 幼猫更常见玩耍性追尾"
    notes: "偶发追尾在幼年个体属正常捕猎动作模式;高频、持续、伴脱毛或破损时超出单次判读范围,应转由执业兽医评估,不在此下诊断。"

  - pattern: "踩奶(kneading)"
    typical_phrases: ["踩奶", "前爪一下一下按", "在我腿上踩", "揉毯子", "边呼噜边踩"]
    candidates: ["高度放松的幼年期动作模式保留", "高唤醒下的动作模式释放"]
    confidence_cap: 0.6
    distinguishing_signals:
      - "发声: 伴随平稳 purr → 偏放松;伴随急促发声 → 见 context_modifiers 的 kneading 条目"
      - "body_posture: 放松侧卧/面包坐姿且肌肉松弛 → 放松;反复更换位置 → 高唤醒"
      - "持续性: 能长时间维持并伴随半闭眼 → 放松"
    notes: "踩奶源自幼年期哺乳动作,成年个体多在高度放松时保留出现;知识库已标 value_confidence=高,但仍需体态与发声交叉验证,不因'在踩奶'就断定舒适。"

  - pattern: "突然炸毛横冲直撞(zoomies)"
    typical_phrases: ["突然满屋子乱跑", "半夜跑酷", "炸毛乱冲", "突然疯跑一阵", "横冲直撞"]
    candidates: ["能量释放 / 高唤醒玩耍", "受惊后的逃离性奔跑"]
    confidence_cap: 0.55
    distinguishing_signals:
      - "有无明确惊吓源: 巨响、陌生人、器械启动 → 偏逃离"
      - "tail: 炸毛竖直 + 夹于腹下 → 偏受惊;竖直/问号尾 → 偏玩耍"
      - "ear_position: 中立前向 → 玩耍;飞机耳/平贴 → 受惊"
      - "终点行为: 跑完即恢复常态并主动接近 → 玩耍;躲入遮蔽物不出 → 受惊"
    notes: "夜间突发奔跑在家猫中常见,多为能量释放;需先排除惊吓源与疼痛引发的暴冲。频率骤增或伴随其他异常时建议兽医评估。"

  - pattern: "被摸着摸着突然咬(过度刺激)"
    typical_phrases: ["摸着摸着就咬我", "本来很享受突然翻脸", "摸肚子被咬", "撸着撸着回头咬一口"]
    candidates: ["抚摸诱发的过度刺激(耐受阈值到达)", "触碰到疼痛部位的防御反应"]
    confidence_cap: 0.6
    distinguishing_signals:
      - "tail.motion: 咬之前是否出现尾尖轻弹或大幅拍打(最可靠的预警时间标记)"
      - "ear_position: 咬之前是否转为双耳侧转/飞机耳"
      - "抚摸部位: 腹部、尾根、特定部位固定触发 → 需排除局部疼痛"
      - "撤离路径: 个体是否被抱住或无处可去(见 context_modifiers 的'接受抚摸时不离开')"
    notes: "多数情况下咬之前已有低位预警(尾尖轻弹、耳侧转、皮肤抽动),被忽略后才升级;这不是'突然翻脸'。固定部位反复触发时应排查躯体不适,由执业兽医评估。"

  - pattern: "盯住猎物低伏摆臀"
    typical_phrases: ["盯着东西屁股扭来扭去", "低着身子摆屁股要扑", "蹲着盯住玩具晃屁股", "隔着窗户盯鸟"]
    candidates: ["捕猎序列的定位阶段(高唤醒专注)", "对不可接近目标的高唤醒挫折"]
    confidence_cap: 0.6
    distinguishing_signals:
      - "目标可及性: 目标在玻璃外/够不到 → 偏挫折,可能伴 chatter"
      - "发声: chatter(下颌咯咯声)→ 对不可接近猎物的高唤醒反应"
      - "whisker_position: 前伸扇开 → 捕猎接触准备"
      - "ear_position: 中立前向/前倾 → 捕猎;飞机耳 → 重新考虑防御性伏低"
    notes: "低伏摆臀是扑击前的后肢蓄力定位,属完整捕猎序列;与防御性伏低形态接近,区分点在耳与胡须朝向及是否有明确视觉目标(见 context_modifiers 的低伏蹲踞)。"

  - pattern: "突然定住不动"
    typical_phrases: ["突然不动了", "僵在那里", "一动不动盯着", "愣住了", "整只猫定格"]
    candidates: ["僵住(行为链中断,压力升级阶梯 level 4)", "捕猎/环境定向中的短暂静止"]
    confidence_cap: 0.6
    distinguishing_signals:
      - "ear_position: 飞机耳/完全平贴 → 偏僵住;中立前向且朝向明确目标 → 偏定向"
      - "有无明确注视目标: 有猎物/声源 → 定向;无明确目标而在社交压力中 → 僵住"
      - "肌肉张力与瞬目: 张力升高 + 瞬目抑制 → 僵住"
      - "前置情境: 是否刚被接近、抱起或围堵"
    notes: "僵住是升级阶梯上的关键转折点,误读为'安静下来了/乖了'是常见且高风险的错误;此时应移除压力源并恢复撤离路径,而不是继续接近。"

# ---------------------------------------------------------------------------
# 疼痛面部指标:Feline Grimace Scale(FGS)
#
# 这是本知识库中少见的【高证据等级】通道:grimace 类量表的系统综述在 9 物种 12 套量表中
# 把 Feline Grimace Scale 与 Mouse / Rat / Horse Grimace Scale 一并列为高证据等级。
#
# ⚠️ 与 signals 的分工(务必分清,不要混用):
#   signals.ear_position / whisker_position 读的是【唤醒与防御意图】;
#   本层的同名动作单元读的是【疼痛】。同一解剖特征、两套体系、两种含义。
#   裁决规则见 conflict_rules 中 "FGS 动作单元 与 signals 同名通道" 一条。
#
# ⚠️ 边界:本层只用于【提示】,不得用于诊断。见 hard_boundary。
# ---------------------------------------------------------------------------
pain_indicators:
  scale_name: "Feline Grimace Scale (FGS)"
  evidence_level: "高"
  source: "10.1038/s41598-019-55693-8"
  source_note: "Evangelista et al., 2019, Scientific Reports —— 量表开发与效度验证。"
  evidence_grading_source: "10.1097/j.pain.0000000000002474"
  evidence_grading_note: "Evangelista et al., 2021, Pain —— grimace 量表系统综述(9 物种 12 套量表),将 Feline Grimace Scale 列为高证据等级。"

  scoring_rule: "5 个动作单元各评 0 / 1 / 2 分。无法可靠观察的单元记为不可观测,不得猜测填分。"

  action_units:

    - unit: "ear_position"
      scoring:
        0: "耳朵朝前"
        1: "耳朵略微分开、轻微外旋"
        2: "耳朵扁平外旋"
      note: "与 signals.ear_position 读的不是同一件事:此处评的是疼痛相关的耳位改变,不是防御性唤醒。折耳品种该单元不可用。"

    - unit: "orbital_tightening"
      scoring:
        0: "眼睑完全张开"
        1: "眼睑部分闭合"
        2: "眼睑明显眯紧"
      note: "眼眶周围肌肉收缩。需排除强光刺激与困倦导致的眯眼。"

    - unit: "muzzle_tension"
      scoring:
        0: "口鼻放松呈圆形"
        1: "介于两者之间"
        2: "口鼻紧张呈椭圆"
      note: "扁脸品种(波斯等)的口鼻轮廓受品种结构限制,该单元应降级或标为不可观测,参见 breed_caveats。"

    - unit: "whiskers_change"
      scoring:
        0: "自然弯曲放松"
        1: "轻微前伸变直"
        2: "明显前伸变直"
      note: "与 signals.whisker_position 的'前伸扇开'形态相近但语义不同:此处指向疼痛,后者指向探查/专注。需结合其余动作单元共同判断,不得单独使用。长毛或低分辨率下不可观测。"

    - unit: "head_position"
      scoring:
        0: "高于肩线"
        1: "与肩线齐平"
        2: "低于肩线或下颏收向胸部"
      note: "需排除正在进食、嗅闻、睡眠等姿势性因素。"

  threshold: "归一化总分 > 0.39(满分 1.0)提示需要镇痛干预,应建议由执业兽医评估。该 cut-off 来自 source 所列研究。"

  reliability: "观察者间 ICC 0.89 (95%CI 0.85–0.92);观察者内 ICC >0.91;内部一致性 Cronbach's α 0.89;与另一已验证量表相关 rho=0.86 (p<0.001)。"

  static_image_validity:
    finding: "静态图片评分与实时观察几乎等效:偏差 -0.057,一致性区间 -0.351 至 0.237。"
    source: "10.7717/peerj.8967"
    source_note: "Evangelista et al., 2020, PeerJ —— 实时评分与照片评分的一致性研究。"
    evidence_level: "高"
    implication: "因此 FGS 相关判读【不因'只有一张照片'而降级】。这是单图模式中少数不受静态素材局限影响的通道。"

  breed_caveats:
    - "折耳品种:ear_position 单元不可用。"
    - "无毛品种与修剪过触须的个体:whiskers_change 单元不可用。"
    - "扁脸(brachycephalic)品种:muzzle_tension 单元受品种结构限制,应降级为不可观测或低置信度。鼻位比与吻部比越小,主人报告的呼吸异常评分越高(P<0.001 / P=0.026),提示其口鼻区形态本身即偏离常态基线。"
    - "长毛个体或低分辨率素材:whiskers_change 与 orbital_tightening 常不可辨。"
  breed_caveats_source: "10.1371/journal.pone.0161777"
  breed_caveats_source_note: "Farnworth et al., 2016, PLoS ONE —— 扁脸猫颅面形态与主人报告的呼吸异常的关联。"

  hard_boundary: "本量表用于【提示】而非诊断。输出只能是『观察到符合疼痛的面部特征,建议由执业兽医评估』,禁止断言疼痛(如『你的猫在痛』)、禁止推测病因、禁止给出任何用药或剂量建议。分数只用于决定是否提示就医,不得作为病情分级呈现给用户。"

# ---------------------------------------------------------------------------
# 时序信号:只有连续画面才能读到的通道
#
# ⚠️ 本层【仅在 video 模式可用】。单图 / 纯音频 / 文字模式下这些通道属【结构性不可观测】,
#    写"不可观测"即可,【不得】因为读不到本层而判证据不足。
# ---------------------------------------------------------------------------
temporal_signals:
  availability: "仅 video(连续画面)。image / audio / text 模式下全部标为不可观测,不计入分母。"

  channels:

    - channel: "tail_motion_dynamics"
      values: ["静止", "尾尖轻弹", "大幅拍打", "整尾左右摆动", "颤抖尾", "缓慢波状摆动", "不可判定"]
      reads: "尾部运动的频率、幅度与其随时间的变化方向(升高 / 下降)。"
      confidence: "中"
      evidence_level: "低"
      source: "行为学通识(无特定文献)"
      note: "单帧只能读到尾巴的位置,读不到运动。摆动频率可由运动曲线 FFT 主频近似,注意帧差能量在每个摆动周期出现两次峰值,主频约为实际摆尾频率的两倍(见 signals.tail.motion.measurement_note)。判读价值主要在于'尾尖轻弹频率是否随抚摸持续而升高'这类趋势,而非某一瞬间的取值。"

    - channel: "ear_movement_dynamics"
      values: ["无明显变化", "反复侧转扫描", "由中立转为飞机耳", "由飞机耳缓解为中立", "高频抽动", "不可判定"]
      reads: "耳位随时间的变化方向,而非某一帧的耳位取值。"
      confidence: "中"
      evidence_level: "低"
      source: "行为学通识(无特定文献)"
      note: "方向比取值更有信息量:'由中立转为飞机耳'指示唤醒升高,是升级阶梯上的方向证据;反向则是缓解。犬类侧有针对耳根后拉的自动化分析证据(见 dog.yaml),猫侧本条【没有】等效的特定文献支持,故评级为低。折耳品种整体不可用。"

    - channel: "open_mouth_breathing_dynamics"
      values: ["无", "短暂张口", "持续张口呼吸", "不可判定"]
      reads: "张口呼吸的出现时机与持续时长。"
      confidence: "中"
      evidence_level: "中"
      source: "10.1371/journal.pone.0161777"
      source_note: "Farnworth et al., 2016, PLoS ONE。"
      note: "⚠️ 必须先排除结构性因素再当作唤醒信号读:扁脸(brachycephalic)品种的鼻位比与吻部比越小,主人报告的呼吸异常评分越高(P<0.001 / P=0.026)。扁脸个体的张口呼吸可能源于品种颅面结构而非情绪唤醒,不可直接计为唤醒升高。猫的张口呼吸在非高温、非剧烈活动后出现时,本身即为需要兽医评估的体征,应按 hard_boundary 的措辞提示就医,不得自行归因于情绪。"

  usage_note: "本层用于补强 video 模式的方向判断(升级 / 缓解),不替代 signals 的逐帧编码。任一通道读不到时写'不可判定',不影响充分性判定。"

# ---------------------------------------------------------------------------
# 情境修正:同一形态在不同情境下功能相反的情形
# ---------------------------------------------------------------------------
context_modifiers:

  - signal: "翻身仰卧露腹"
    default: "低唤醒放松"
    default_note: "肌肉松弛、四肢自然张开、瞳孔与照度相称、无视线锁定。"
    override_when: "身体僵直 + 四爪朝向对方 + 耳平贴 + 视线锁定"
    override_to: "防御性仰卧,四肢处于可用状态"
    override_note: "此形态下四爪与齿列同时朝向对方,是防御效率最高的姿势,不是邀请触摸。误读为示好是被抓伤的常见成因。"
    confidence: "高"

  - signal: "purr"
    default: "低唤醒接触"
    override_when: "伴随蜷缩、瞬目减少、活动量下降或近期受伤"
    override_to: "自我安抚,可能与疼痛或不适并存"
    override_note: "purr 不是舒适的充分证据,单独出现时置信度低。"
    confidence: "中"

  - signal: "颤抖尾"
    default: "高唤醒亲和接近"
    override_when: "后躯抬高 + 背向垂直面 + 短暂静止"
    override_to: "喷尿标记动作"
    confidence: "中"

  - signal: "瞳孔完全散大"
    default: "交感激活"
    override_when: "环境照度低或刚发生照度下降"
    override_to: "光适应,无判读价值"
    confidence: "高"

  - signal: "低伏蹲踞"
    default: "捕猎潜伏"
    override_when: "耳后转或飞机耳 + 胡须后收 + 无明确注视目标"
    override_to: "防御性伏低"
    override_note: "两者形态接近,区分点在耳与胡须朝向,以及是否存在明确的视觉目标。"
    confidence: "中"

  - signal: "接受抚摸时不离开"
    default: "接受接触"
    override_when: "身体僵直 + 尾尖轻弹频率上升 + 无可撤离路径"
    override_to: "被动忍受,即将升级"
    override_note: "不离开可能是无处可去。判读前必须确认个体是否具备撤离路径。"
    confidence: "高"

  - signal: "面包坐姿"
    default: "常规休息"
    override_when: "体态收紧 + 瞬目减少 + 长时间不换姿势 + 对刺激反应迟钝"
    override_to: "不适或低度警戒"
    confidence: "低"

  - signal: "kneading"
    default: "高度放松"
    override_when: "伴随急促发声与反复更换位置"
    override_to: "高唤醒下的动作模式释放"
    confidence: "低"

# ---------------------------------------------------------------------------
# 信号冲突处理:多通道不一致时的裁决规则
# ---------------------------------------------------------------------------
conflict_rules:

  - conflicting: ["purr", "身体僵直"]
    resolution: "purr 的置信度低于体态。以僵直为准,判为自我安抚而非舒适,并提示排查躯体不适。"
    priority: "以高置信度通道为准"
    confidence: "中"

  - conflicting: ["尾部大幅拍打", "接受抚摸中"]
    resolution: "拍打是唤醒升高的高置信度信号。判为耐受阈值接近,预期在数秒内出现撤离或拍击,不判为享受。"
    priority: "以尾部运动为准"
    confidence: "高"

  - conflicting: ["竖直尾接近", "耳朵侧转"]
    resolution: "竖直尾是接近意图,耳侧转是不确定。判为接近意愿存在但仍在评估中,应保持静止让其自行完成接近,不主动伸手。"
    priority: "两者并存,不做单一裁决"
    confidence: "中"

  - conflicting: ["hiss", "未后退"]
    resolution: "不因未后退而弱化 hiss。未后退常因缺乏撤离路径。以 hiss 为准,判为明确的距离增加请求。"
    priority: "以高置信度通道为准"
    confidence: "高"

  - conflicting: ["slow blink", "瞳孔散大"]
    resolution: "瞳孔通道在照度未知时不可用。若照度可控且确认未变,则判为高唤醒下的缓和尝试;否则忽略瞳孔通道。"
    priority: "以可观测性更高的通道为准"
    confidence: "低"

  - conflicting: ["弓背侧身", "缓慢接近"]
    resolution: "弓背侧身是防御性展示。缓慢接近不改变其性质,判为在威吓状态下的试探,不判为友好接近。"
    priority: "以体态为准"
    confidence: "中"

  - conflicting: ["翻身露腹", "耳平贴"]
    resolution: "见 context_modifiers 的翻身仰卧露腹条目,按防御性仰卧处理。"
    priority: "以耳部通道为准"
    confidence: "高"

  - conflicting: ["位移信号密度高", "整体姿态未变"]
    resolution: "位移信号在时间上先于姿态变化。密度规则触发时判为压力上升的早期阶段。"
    priority: "以位移信号为准"
    confidence: "中"

  - conflicting: ["FGS 动作单元", "signals 中的同名通道(ear_position / whisker_position)"]
    resolution: "两套体系读的是同一解剖特征的【不同维度】,不得混用、不得互相替代填值,也不得把同一处观察在两边各记一次当作两条独立证据。分别编码后按下面的优先级裁决:(1) 若 FGS 达到提示阈值(归一化 >0.39)且 ≥3 个动作单元可观测 —— 优先按疼痛线索处理,输出『观察到符合疼痛的面部特征,建议由执业兽医评估』,并同时保留唤醒/防御的解读,不要用情绪结论覆盖疼痛提示;(2) 若 FGS 未达阈值或可观测单元 <3 —— 按 signals 的唤醒/防御体系解读,FGS 只作佐证,不单独成立;(3) 两者指向冲突时(例:耳朵扁平外旋,FGS 计 2 分,而 signals 读作防御性飞机耳)—— 二者并不互斥,同一形态可以既是疼痛表现又是防御性唤醒,应【并列列为候选】而不是二选一,并在 missing_signals 里指出需要补充哪些单元或通道才能区分。"
    priority: "疼痛提示优先于情绪归因(疼痛漏判的代价更高);但两者并存时并列输出,不做单一裁决"
    confidence: "中"
    evidence_level: "低"
    source: "行为学通识(无特定文献)—— 裁决规则本身为本项目的工程约定,FGS 与其阈值的出处见 pain_indicators.source"

# ---------------------------------------------------------------------------
# 压力升级阶梯:从低强度回避到咬合
# 阶梯不必逐级出现;空间受限或既往预警被忽略的个体可能跳过中间层级。
# ---------------------------------------------------------------------------
escalation_ladder:

  - level: 1
    label: "低强度回避"
    signals: ["转头回避", "舔鼻", "假装梳理", "双耳侧转", "尾尖轻弹"]
    notes: "成本最低的调节尝试,幅度小、极易被忽略。此层级停止互动,冲突概率下降最明显。"
    confidence: "中"

  - level: 2
    label: "主动脱离"
    signals: ["起身走开", "跳上高处", "钻入遮蔽物", "抖毛后离开"]
    notes: "个体主动增加距离或选择垂直空间。此层级被阻断(抱起、追随、堵住退路)会直接推动升级。"
    confidence: "高"

  - level: 3
    label: "防御性姿态"
    signals: ["飞机耳", "胡须后收", "低伏蹲踞", "尾夹于腹下", "半蹲后撤"]
    notes: "个体已判定无法脱离,转为准备防御。此层级触摸风险已显著升高。"
    confidence: "高"

  - level: 4
    label: "僵住"
    signals: ["全身位移接近零", "肌肉张力升高", "视线锁定", "瞬目抑制"]
    notes: "行为链中断,是阶梯上的关键转折点。误读为'安静下来了'是常见且高风险的错误。"
    confidence: "高"

  - level: 5
    label: "明示警告"
    signals: ["hiss", "growl", "耳完全平贴", "弓背炸毛侧身展示", "露出犬齿"]
    notes: "明确的距离增加请求。惩罚此层级会使个体在后续情境中跳过警告直接升级,应始终视为需要保留的信息。"
    confidence: "高"

  - level: 6
    label: "威慑性接触"
    signals: ["收爪拍击", "空咬", "快速前扑后立即撤回"]
    notes: "爪未伸出或牙齿未闭合,具备完整攻击能力但主动控制了强度,属最后一次警告。"
    confidence: "高"

  - level: 7
    label: "全力防御"
    signals: ["伸爪抓击", "咬合并抱握", "后肢连续蹬踢"]
    notes: "常表现为咬握配合后肢蹬踢的组合。此阶段个体通常已处于无法撤离的状态,恢复需要移除围堵而非施压。"
    confidence: "高"

# ---------------------------------------------------------------------------
# 输出约束:供 prompt 直接引用
# ---------------------------------------------------------------------------
output_constraints:
  - "对每个判读结论必须列出所依据的通道,以及各通道的置信度等级。"
  - "通道不可观测时输出'不可观测',不得由其他通道推测其取值。"
  - "低置信度通道不得单独支撑结论,瞳孔通道在照度未知时直接排除。"
  - "判读涉及触摸建议时,必须先说明个体是否具备可撤离路径。"
  - "涉及疼痛、疾病或持续性行为问题的迹象,只描述观察到的形态,并建议由执业兽医或行为专业人员评估。"
